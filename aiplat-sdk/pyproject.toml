[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiplat-sdk"
version = "0.1.0"
description = "aiPlat Agent SDK — 3 lines to create and execute an AI Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "aiPlat Team"}]
keywords = ["ai", "agent", "llm", "ai-platform", "agent-sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.27",
    "sseclient-py>=1.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
full = [
    "rich>=13.0",
    "tqdm>=4.66",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/zhuxiangqun/aiPlatform"
Documentation = "https://github.com/zhuxiangqun/aiPlatform/blob/main/aiplat-sdk/README.md"
Repository = "https://github.com/zhuxiangqun/aiPlatform"
Issues = "https://github.com/zhuxiangqun/aiPlatform/issues"

[tool.setuptools.packages.find]
include = ["aiplat*"]

[tool.setuptools.package-dir]
"" = "."
