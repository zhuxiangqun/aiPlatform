[project]
name = "aiplat-sdk"
version = "0.1.0"
description = "aiPlat Agent SDK — 3 lines to create and execute an AI Agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "aiPlat Team"}]

dependencies = [
    "httpx>=0.27",
    "sseclient-py>=1.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
full = [
    "rich>=13.0",       # 终端美化输出
    "tqdm>=4.66",       # 进度条
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["aiplat*"]

[tool.setuptools.package-dir]
"" = "."
