# docker-compose.yml — Production deployment
#
# 用法:
#   docker compose up -d
#   docker compose down
#
# 前置:
#   docker compose build  # build images first
#
# 环境变量: 见 .env 或 .env.production

x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "3"

services:
  infra:
    build:
      context: .
      dockerfile: aiPlat-infra/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8001:8001"
    volumes:
      - ./.aiplat:/app/.aiplat
      - ./aiPlat-infra/config:/app/aiPlat-infra/config:ro
    environment:
      - AIPLAT_HOME=/app/.aiplat
      - AIPLAT_LLM_CONFIG_PATH=/app/aiPlat-infra/config/infra/llm_profile.yaml
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  core:
    build:
      context: .
      dockerfile: aiPlat-core/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8002:8002"
    depends_on:
      infra:
        condition: service_healthy
    volumes:
      - ./.aiplat:/app/.aiplat
    environment:
      - AIPLAT_HOME=/app/.aiplat
      - AIPLAT_REPO_ROOT=/app
      - AIPLAT_LLM_CONFIG_PATH=/app/aiPlat-infra/config/infra/llm_profile.yaml
      - AIPLAT_EXECUTION_DB_PATH=/app/.aiplat/aiplat_executions.sqlite3
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/api/core/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  platform:
    build:
      context: .
      dockerfile: aiPlat-platform/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8003:8003"
    depends_on:
      core:
        condition: service_healthy
    volumes:
      - ./.aiplat:/app/.aiplat
    environment:
      - AIPLAT_HOME=/app/.aiplat
      - AIPLAT_REPO_ROOT=/app
      - AIPLAT_PLATFORM_DB_PATH=/app/.aiplat/aiplat_platform.sqlite3
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: aiPlat-app/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8004:8004"
    depends_on:
      platform:
        condition: service_healthy
    volumes:
      - ./.aiplat:/app/.aiplat
    environment:
      - AIPLAT_HOME=/app/.aiplat
      - AIPLAT_APP_DB_PATH=/app/.aiplat/aiplat_app.sqlite3
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  management:
    build:
      context: .
      dockerfile: aiPlat-management/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8000:8000"
    depends_on:
      core:
        condition: service_healthy
      platform:
        condition: service_healthy
    volumes:
      - ./.aiplat:/app/.aiplat
    environment:
      - AIPLAT_HOME=/app/.aiplat
      - AIPLAT_MANAGEMENT_MODE=production
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: ./aiPlat-management/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "5173:80"
    depends_on:
      core:
        condition: service_healthy
      platform:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Observability (optional — docker compose --profile observability up) ──
  prometheus:
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "9090:9090"
    volumes:
      - ./aiPlat-core/deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3001:3000"
    volumes:
      - ./aiPlat-core/deploy/grafana/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./aiPlat-core/deploy/grafana/dashboards/aiplat-overview.json:/etc/grafana/provisioning/dashboards/aiplat-overview.json:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.54
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    volumes:
      - jaeger_data:/tmp/jaeger

volumes:
  prometheus_data:
  grafana_data:
  jaeger_data:
