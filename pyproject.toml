[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
]
ignore = [
    "F821",    # undefined-name (false positives in eval/exec)
    "N818",    # exception-naming
    "B008",    # do-not-perform-function-calls-in-argument-defaults
    "B907",    # assert-raises-without-context
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802", "N803", "N806"]
"aiPlat-core/core/harness/execution/pipeline_engine.py" = ["F821"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true
warn_redundant_casts = true
strict = false

[tool.coverage.report]
fail_under = 70
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
