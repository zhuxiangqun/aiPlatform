apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-central
  labels:
    app.kubernetes.io/name: aiplat-central
    aiplat.capability_id: aiplat
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aiplat-central
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiplat-central
    spec:
      containers:
        - name: core
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/core/healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
