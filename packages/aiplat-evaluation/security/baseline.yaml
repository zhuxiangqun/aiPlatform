    path: packages/aiplat-evaluation/docs/D2_COHOST.md
    must_contain:
      - "D1c"
      - "process_split_authorized=false"
  - id: evaluation_security_doc
    path: packages/aiplat-evaluation/docs/SECURITY.md
    must_contain:
      - "cohost"
      - "签收"
  - id: evaluation_perf_doc
    path: packages/aiplat-evaluation/docs/PERF_BASELINE.md
    must_contain:
      - "validate_sample"
