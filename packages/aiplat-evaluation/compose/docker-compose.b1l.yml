# B1-L local stack — engineering only (environment=local).
# Does NOT set process_split_authorized / staging_ready.
# Usage:
#   docker compose -f compose/docker-compose.b1l.yml up -d postgres minio
#   export AIPLAT_EVAL_DB_URL='postgresql://eval:eval_local@127.0.0.1:5433/eval'
#   bash scripts/migrate_local.sh && bash scripts/run_local.sh
#
# SQLite remains default when AIPLAT_EVAL_DB_URL is unset.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eval
      POSTGRES_PASSWORD: eval_local
      POSTGRES_DB: eval
    ports:
      - "5433:5432"
    volumes:
      - eval_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eval -d eval"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: evalminio
      MINIO_ROOT_PASSWORD: evalminio_local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - eval_minio_data:/data

volumes:
  eval_pg_data:
  eval_minio_data:
