# aiPlat LLM Profile — model overrides & purpose profiles
# gemma4:12b produces empty output (known issue on Apple Silicon),
# so we override all purposes to use qwen2.5-coder:7b as the reliable default.

model_overrides:
  chat: qwen2.5-coder:7b
  agent_creation: qwen2.5-coder:7b
  code_gen: qwen2.5-coder:7b
  ontology_gen: qwen2.5-coder:7b
  embedding: mxbai-embed-large:latest

purpose_profiles:
  chat:
    prefer: ["chat"]
    prefer_local: true
  agent_creation:
    prefer: ["chat"]
    prefer_local: true
  code_gen:
    prefer: ["chat", "code"]
    prefer_local: true
  ontology_gen:
    prefer: ["chat"]
    prefer_local: true

fallback:
  ultimate_model: qwen2.5-coder:7b
