# aiPlat LLM Profile — purpose profiles (workspace overlay, deep-merged onto infra)
# Prefer local where safe; do NOT replace infra require/weights wholesale.
# Factory PM/PRD uses purpose ``agent`` (see BuilderProjectService.model).

purpose_profiles:
  chat:
    prefer_local: true
  agent:
    # Keep infra agent quality bars; only bias toward local when comparable
    prefer_local: true
  agent_creation:
    prefer_local: true
  code_gen:
    # false：编码质量优先；有云端 coder 时不应被本地 7b 行政加分锁死
    # （当前环境无 API + RAM 40% 门 → 仍只会落到 qwen2.5-coder:7b）
    prefer_local: false
  ontology_gen:
    prefer_local: true

fallback:
  safe_model: qwen2.5:3b
  safe_model_alt: qwen2.5-coder:7b
  safe_model_ram_limit: 4
