# aiPlat LLM Profile — purpose requirements & model capabilities
# v3: Capability-driven selection. Each purpose declares WHAT it needs (requirements).
# The engine auto-matches against model_capabilities. No manual model preferences.
# Selection is driven by model_capabilities + resource awareness, not human guesses.

purpose_profiles:
  chat:
    description: 日常对话 — 低延迟优先,本地模型即可
    require:
      type: chat
      hallucination_max: 0.10
    weights:
      latency: -2.5
      quality: 0.3
      api_credential: 1.0
  clarify:
    description: 澄清问题 — 极低延迟,不强调推理质量
    require:
      type: chat
    weights:
      latency: -3.0
      api_credential: 1.0
  agent:
    description: Agent编排/测试执行 — 需要强推理+大上下文+低幻觉
    require:
      reasoning_quality: 3
      context_window: 32000
      hallucination_max: 0.06
    weights:
      reasoning: 3.5
      quality: 1.5
      latency: -1.0
      cost: -0.5
  code_gen:
    description: 代码生成 — 需要强推理+编码能力
    require:
      reasoning_quality: 2
      context_window: 16000
    weights:
      reasoning: 2.5
      latency: -0.5
      api_credential: 1.0
  reasoning:
    description: 复杂推理 — 需要最强推理+低幻觉+大上下文
    require:
      reasoning_quality: 4
      context_window: 64000
      hallucination_max: 0.05
    weights:
      reasoning: 3.5
      quality: 1.8
      latency: -1.0
      resource_pressure: 0.3
      cost: -0.3
  skill_execution:
    description: Skill执行 — 需要稳定可靠+中等推理
    require:
      reasoning_quality: 2
      context_window: 16000
    weights:
      reasoning: 1.2
      resource_pressure: 1.5
  ontology_gen:
    description: 本体生成 — 本地优先,基础推理即可
    require:
      type: chat
      context_window: 16000
    weights:
      api_credential: 1.0
  wiki_curation:
    description: Wiki策展 — 后台任务,低优先级,偏好API模型
    require:
      hallucination_max: 0.08
    weights:
      cost: -3.0
      latency: -0.5

fallback:
  safe_model: qwen2.5:3b
  safe_model_alt: qwen2.5-coder:7b
  safe_model_ram_limit: 4

# ── Scoring weights (v2.2 dynamic) ──
default_scoring_weights:
  source_bias: 1.0
  resource_pressure: 1.0
  gpu_compat: 1.0
  reasoning: 1.0
  quality: 1.0
  latency: -1.0
  concurrency: 1.0
  cost: -1.0
  api_credential: 3.0

