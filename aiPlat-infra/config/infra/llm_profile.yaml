# aiPlat LLM Profile — purpose profiles & model capabilities
# All purposes are auto-selected by the unified scoring pipeline (v2.1).
# Selection is driven by model_capabilities + resource awareness, not manual overrides.

purpose_profiles:
  chat:
    prefer: ["chat"]
    prefer_local: true
    local_preference_weight: 3.0
    scoring_weights:
      reasoning: 0.3
      latency: -2.5
  clarify:
    prefer: ["chat"]
    prefer_local: true
    scoring_weights:
      reasoning: 0.1
      latency: -3.0
      quality: 0.5
  agent_creation:
    prefer: ["chat"]
    prefer_local: true
  code_gen:
    prefer: ["chat", "code"]
    scoring_weights:
      reasoning: 2.5
      latency: -0.5
  reasoning:
    prefer: ["chat", "reasoning"]
    prefer_external: true
    scoring_weights:
      reasoning: 3.5
      quality: 1.8
      resource_pressure: 0.3
      cost: -0.3
  skill_execution:
    prefer: ["chat"]
    prefer_external: true
    scoring_weights:
      resource_pressure: 1.5
      reasoning: 1.2
  ontology_gen:
    prefer: ["chat"]
    prefer_local: true
  wiki_curation:
    prefer: ["chat"]
    prefer_external: true   # background tasks: prefer API models over local ollama
    scoring_weights:
      cost: -3.0            # minimize cost for background tasks
      latency: -0.5

fallback:
  safe_model: qwen2.5:3b
  safe_model_alt: qwen2.5-coder:7b
  safe_model_ram_limit: 4

# ── Scoring weights (v2.2 dynamic) ──
default_scoring_weights:
  source_bias: 1.0
  resource_pressure: 1.0
  gpu_compat: 1.0
  reasoning: 1.0
  quality: 1.0
  latency: -1.0
  concurrency: 1.0
  cost: -1.0
  api_credential: 3.0

# ── Model capability profiles (P2: structured registration) ──
# Used by ModelManager.select(purpose, complexity, input_tokens) for intelligent routing.
model_capabilities:
  qwen2.5:3b:
    context_window: 32768
    effective_utilization: 0.70
    input_token_budget: 15000
    semantic_understanding: 3
    reasoning_quality: 1
    hallucination_rate: 0.08
    strength_areas: ["chat"]
    weakness_areas: ["reasoning", "code_generation", "multi_doc_synthesis"]
    routing_rules:
      min_complexity: 0
      max_complexity: 1
  deepseek-chat:
    context_window: 131072
    effective_utilization: 0.85
    input_token_budget: 80000
    semantic_understanding: 5
    reasoning_quality: 5
    hallucination_rate: 0.04
    strength_areas: ["instruction_following", "long_form_summary", "multi_doc_synthesis"]
    weakness_areas: []
    routing_rules:
      min_complexity: 2
      max_complexity: 5
  deepseek-v3:  # renamed from deepseek-reasoner (deprecated model name)
    context_window: 65536
    effective_utilization: 0.90
    input_token_budget: 50000
    semantic_understanding: 5
    reasoning_quality: 4
    hallucination_rate: 0.03
    strength_areas: ["reasoning"]
    weakness_areas: ["long_form_summary", "instruction_following"]
    routing_rules:
      min_complexity: 3
      max_complexity: 5
  gemma4:12b:
    context_window: 131072
    effective_utilization: 0.80
    input_token_budget: 60000
    semantic_understanding: 5
    reasoning_quality: 4
    hallucination_rate: 0.05
    strength_areas: ["chat", "fact_lookup", "instruction_following", "multi_doc_synthesis"]
    weakness_areas: ["code_generation"]
    routing_rules:
      min_complexity: 1
      max_complexity: 4
  qwen2.5-coder:7b:
    context_window: 32768
    effective_utilization: 0.75
    input_token_budget: 20000
    semantic_understanding: 4
    reasoning_quality: 3
    hallucination_rate: 0.06
    strength_areas: ["fact_lookup", "code_generation"]
    weakness_areas: ["multi_doc_synthesis", "long_form_summary"]
    routing_rules:
      min_complexity: 0
      max_complexity: 2
  qwen2.5-coder:32b:
    context_window: 32768
    effective_utilization: 0.80
    input_token_budget: 24000
    semantic_understanding: 4
    reasoning_quality: 4
    hallucination_rate: 0.05
    strength_areas: ["fact_lookup", "code_generation", "multi_doc_synthesis"]
    weakness_areas: []
    routing_rules:
      min_complexity: 1
      max_complexity: 4
  qwen2.5-coder:14b:
    context_window: 32768
    effective_utilization: 0.78
    input_token_budget: 22000
    semantic_understanding: 4
    reasoning_quality: 3
    hallucination_rate: 0.05
    strength_areas: ["fact_lookup", "code_generation"]
    weakness_areas: ["long_form_summary"]
    routing_rules:
      min_complexity: 0
      max_complexity: 3
  deepseek-v4-pro:
    context_window: 131072
    effective_utilization: 0.85
    input_token_budget: 80000
    max_tokens: 8192
    semantic_understanding: 5
    reasoning_quality: 5
    hallucination_rate: 0.04
    strength_areas: ["fact_lookup", "multi_doc_synthesis", "evaluation", "code_generation"]
    weakness_areas: []
    pricing:
      prompt_per_1m: 0.27
      completion_per_1m: 1.10
      cache_read_per_1m: 0.07
      cache_write_per_1m: 0.27
    routing_rules:
      min_complexity: 1
      max_complexity: 4

# ── Phase 12.2: T1-T5 tiered routing ──
# Each tier defines complexity range, default model, and fallback chain.
# ModelTierRouter selects the first available model in tier order.
# T1 = cheapest/fastest, T5 = most capable/expensive.
tiers:
  T1:
    label: "轻量/快速"
    complexity_range: [0, 1]
  T2:
    label: "日常对话"
    complexity_range: [1, 2]
  T3:
    label: "内容创作/编码"
    complexity_range: [2, 3]
  T4:
    label: "复杂推理"
    complexity_range: [3, 4]
  T5:
    label: "高难度推理"
    complexity_range: [4, 5]

# ── TTS: 本地语音合成 (Piper TTS) ──
tts:
  default: piper_zh_CN
  models:
    - name: piper_zh_CN
      capability: tts
      provider: local
      engine: piper
      model_path: ~/.aiplat/models/piper_zh_CN.onnx
      speaker: huayan
      language: zh-CN
      enabled: true
