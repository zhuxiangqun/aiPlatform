# aiPlat LLM Profile — model overrides & purpose profiles
# gemma4:12b produces empty output (known issue on Apple Silicon).
# chat / agent_creation use conversational models; code_gen keeps coder.
# To switch to cloud API: set DEEPSEEK_API_KEY and change overrides to deepseek-chat.

model_overrides:
  chat: qwen2.5:3b
  clarify: qwen2.5-coder:14b
  agent_creation: deepseek-chat
  skill_execution: deepseek-chat
  ontology_gen: qwen2.5-coder:7b
  embedding: mxbai-embed-large:latest

purpose_profiles:
  chat:
    prefer: ["chat"]
    prefer_local: true
  clarify:
    prefer: ["chat"]
    prefer_local: true
  agent_creation:
    prefer: ["chat"]
    prefer_local: true
  code_gen:
    prefer: ["chat", "code"]
  reasoning:
    prefer: ["chat", "reasoning"]
    prefer_external: true
  skill_execution:
    prefer: ["chat"]
    prefer_external: true
  ontology_gen:
    prefer: ["chat"]
    prefer_local: true

fallback:
  ultimate_model: qwen2.5-coder:32b

# ── Model capability profiles (P2: structured registration) ──
# Used by ModelManager.select(purpose, complexity, input_tokens) for intelligent routing.
model_capabilities:
  deepseek-chat:
    context_window: 131072
    effective_utilization: 0.85
    input_token_budget: 80000
    semantic_understanding: 5
    reasoning_quality: 5
    hallucination_rate: 0.04
    strength_areas: ["instruction_following", "long_form_summary", "multi_doc_synthesis"]
    weakness_areas: []
    routing_rules:
      min_complexity: 2
      max_complexity: 5
  deepseek-reasoner:
    context_window: 65536
    effective_utilization: 0.90
    input_token_budget: 50000
    semantic_understanding: 5
    reasoning_quality: 2
    hallucination_rate: 0.03
    strength_areas: ["reasoning"]
    weakness_areas: ["long_form_summary", "instruction_following"]
    routing_rules:
      min_complexity: 3
      max_complexity: 5
  qwen2.5-coder:7b:
    context_window: 32768
    effective_utilization: 0.75
    input_token_budget: 20000
    semantic_understanding: 4
    reasoning_quality: 3
    hallucination_rate: 0.06
    strength_areas: ["fact_lookup", "code_generation"]
    weakness_areas: ["multi_doc_synthesis", "long_form_summary"]
    routing_rules:
      min_complexity: 0
      max_complexity: 2
  qwen2.5-coder:32b:
    context_window: 32768
    effective_utilization: 0.80
    input_token_budget: 24000
    semantic_understanding: 4
    reasoning_quality: 4
    hallucination_rate: 0.05
    strength_areas: ["fact_lookup", "code_generation", "multi_doc_synthesis"]
    weakness_areas: []
    routing_rules:
      min_complexity: 1
      max_complexity: 4
  qwen2.5-coder:14b:
    context_window: 32768
    effective_utilization: 0.78
    input_token_budget: 22000
    semantic_understanding: 4
    reasoning_quality: 3
    hallucination_rate: 0.05
    strength_areas: ["fact_lookup", "code_generation"]
    weakness_areas: ["long_form_summary"]
    routing_rules:
      min_complexity: 0
      max_complexity: 3
  deepseek-v4-pro:
    context_window: 131072
    effective_utilization: 0.85
    input_token_budget: 80000
    max_tokens: 8192
    semantic_understanding: 5
    reasoning_quality: 5
    hallucination_rate: 0.04
    strength_areas: ["fact_lookup", "multi_doc_synthesis", "evaluation", "code_generation"]
    weakness_areas: []
    pricing:
      prompt_per_1m: 0.27
      completion_per_1m: 1.10
      cache_read_per_1m: 0.07
      cache_write_per_1m: 0.27
    routing_rules:
      min_complexity: 1
      max_complexity: 4

# ── Phase 12.2: T1-T5 tiered routing ──
# Each tier defines complexity range, default model, and fallback chain.
# ModelTierRouter selects the first available model in tier order.
# T1 = cheapest/fastest, T5 = most capable/expensive.
tiers:
  T1:
    label: "轻量/快速"
    complexity_range: [0, 1]
    default_model: "qwen2.5:3b"
    max_tools: 4
  T2:
    label: "日常对话"
    complexity_range: [1, 2]
    default_model: "qwen2.5-coder:7b"
    fallback_models: ["deepseek/deepseek-v4-flash"]
    max_tools: 8
  T3:
    label: "内容创作/编码"
    complexity_range: [2, 3]
    default_model: "qwen2.5-coder:7b"
    fallback_models: ["deepseek/deepseek-v4-flash"]
    max_tools: 16
  T4:
    label: "复杂推理"
    complexity_range: [3, 4]
    default_model: "deepseek/deepseek-v4-pro"
    max_tools: 32
  T5:
    label: "高难度推理"
    complexity_range: [4, 5]
    default_model: "deepseek/deepseek-v4-pro"
    max_tools: 64
