# aiPlat LLM Profile — model overrides & purpose profiles
# gemma4:12b produces empty output (known issue on Apple Silicon).
# chat / agent_creation use conversational models; code_gen keeps coder.
# To switch to cloud API: set DEEPSEEK_API_KEY and change overrides to deepseek-chat.

model_overrides:
  chat: qwen2.5:3b
  agent_creation: qwen2.5:3b
  ontology_gen: qwen2.5-coder:7b
  embedding: mxbai-embed-large:latest

purpose_profiles:
  chat:
    prefer: ["chat"]
    prefer_local: true
  agent_creation:
    prefer: ["chat"]
    prefer_local: true
  code_gen:
    prefer: ["chat", "code"]
  reasoning:
    prefer: ["chat", "reasoning"]
    prefer_external: true
  ontology_gen:
    prefer: ["chat"]
    prefer_local: true

fallback:
  ultimate_model: minicpm-v:8b

# ── Model capability profiles (P2: structured registration) ──
# Used by ModelManager.select(purpose, complexity, input_tokens) for intelligent routing.
model_capabilities:
  qwen2.5-coder:7b:
    context_window: 32768
    effective_utilization: 0.75
    input_token_budget: 20000
    semantic_understanding: 4
    reasoning_quality: 3
    hallucination_rate: 0.06
    strength_areas: ["fact_lookup", "code_generation"]
    weakness_areas: ["multi_doc_synthesis", "long_form_summary"]
    routing_rules:
      min_complexity: 0
      max_complexity: 2
  deepseek-v4-pro:
    context_window: 131072
    effective_utilization: 0.85
    input_token_budget: 80000
    max_tokens: 8192
    semantic_understanding: 5
    reasoning_quality: 5
    hallucination_rate: 0.04
    strength_areas: ["fact_lookup", "multi_doc_synthesis", "evaluation", "code_generation"]
    weakness_areas: []
    pricing:
      prompt_per_1m: 0.27
      completion_per_1m: 1.10
      cache_read_per_1m: 0.07
      cache_write_per_1m: 0.27
    routing_rules:
      min_complexity: 1
      max_complexity: 4
