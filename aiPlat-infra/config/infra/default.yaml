# AI Platform - 默认配置文件

# 数据库配置
database:
  type: postgres
  host: localhost
  port: 5432
  name: ${AIPLAT_DB_NAME:}
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  
  # 连接池配置
  pool:
    min_size: 5
    max_size: 20
    max_overflow: 10
    pool_timeout: 30
    recycle: 3600
  
  # SSL配置
  ssl:
    enabled: false
    cert_path: null
  
  # 延迟初始化
  lazy_init: true

# LLM配置
llm:
  provider: openai
  model: gpt-4
  api_key_env: OPENAI_API_KEY
  timeout: 30
  max_retries: 3
  
  # 限流配置
  rate_limit:
    max_concurrent: 10
    tokens_per_minute: 100000
    models:
      gpt-4:
        tokens_per_minute: 50000
        requests_per_minute: 100
  
  # 模型参数
  default_params:
    temperature: 0.7
    max_tokens: 2000
  
  # 重试配置
  retry:
    max_attempts: 3
    backoff_factor: 2
  
  # 降级配置
  fallback:
    enabled: true
    fallback_chain:
      - gpt-4-turbo
      - gpt-3.5-turbo

# 向量存储配置
vector:
  type: milvus
  host: localhost
  port: 19530
  dimension: 1536
  
  index:
    type: HNSW
    params:
      m: 16
      ef_construction: 256
  
  lazy_init: true

# 缓存配置
cache:
  type: redis
  host: localhost
  port: 6379
  password: ${REDIS_PASSWORD}
  db: 0
  
  pool:
    max_connections: 50
    retry_on_timeout: true
  
  default_ttl: 3600
  max_entries: 10000
  key_prefix: "${AIPLAT_CACHE_KEY_PREFIX:}"
  
  lazy_init: true

# 日志配置
logging:
  level: ${LOG_LEVEL:INFO}
  format: json
  
  output:
    - console
    - file
  
  file:
    path: ${AIPLAT_LOG_PATH:}
    max_size: 100MB
    backup_count: 10

# 监控配置
monitoring:
  enabled: true
  port: 9090
  
  metrics:
    prefix: ${AIPLAT_METRICS_PREFIX:}
    labels:
      env: development
      service: infra
  
  health_check:
    enabled: true
    path: /health
    interval: 30

# 网络配置
network:
  service_discovery:
    enabled: true
    type: dns
  
  load_balancer:
    strategy: round_robin
  
  network_policy:
    enabled: false

# 算力配置
compute:
  enabled: true
  
  gpu:
    enabled: true
    default_type: ${AIPLAT_GPU_DEFAULT_TYPE:}
  
  scheduler:
    strategy: fifo
  
  quota:
    enabled: true

# 内存配置
memory:
  enabled: true
  
  pool:
    max_size: 8GB
  
  oom_protection:
    enabled: true
    threshold: 0.9

# 消息队列配置
messaging:
  backend: redis
  
  # Redis 配置（轻量级，适合小规模）
  hosts:
    - localhost:6379
  
  topic_prefix: "${AIPLAT_MSG_TOPIC_PREFIX:}"
  client_id: "${AIPLAT_MSG_CLIENT_ID:}"
  
  redis:
    db: 0
    password: ${REDIS_PASSWORD}
    pool_size: 10
  
  # Kafka 配置（高吞吐量）
  # kafka:
  #   consumer_group: "${AIPLAT_KAFKA_CONSUMER_GROUP:}"
  #   auto_offset_reset: "latest"
  #   enable_auto_commit: true
  #   session_timeout_ms: 10000
  #   heartbeat_interval_ms: 3000
  
  # RabbitMQ 配置（可靠性高）
  # rabbitmq:
  #   username: guest
  #   password: guest
  #   vhost: /
  #   exchange_type: topic
  #   durable: true

# MCP配置
mcp:
  enabled: true
  
  servers: {}
  
   timeout: 30
   
   retry:
     max_attempts: 3

# 模型发现配置（启动时从环境变量 + 本地扫描动态构建模型列表）
model_discovery:
  # 从环境变量读取的 remote 模型（逗号分隔的 model_name 列表）
  # Models registered via Management UI → SQLite adapters table
  # (credentials stored in SQLite, no env var needed)
  env_models: []
  
  # 本地模型 endpoint 扫描（自动发现）
  local_scan:
    endpoints:
      - http://localhost:11434  # Ollama
      - http://localhost:1234   # LM Studio
      - http://localhost:8000   # oMLX / vLLM / llama.cpp server
    auto_scan: true

# 本地 Embedding 模型配置
local_embedding:
  enabled: true
  models:
    - name: all-mpnet-base-v2
      path: sentence-transformers/all-mpnet-base-v2
      dimension: 768
      enabled: true