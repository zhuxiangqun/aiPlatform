<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>aiPlat 系统概览</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#c9d1d9;--green:#3fb950;--yellow:#d2991d;--red:#f85149;--blue:#58a6ff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--bg);color:var(--text);padding:24px}
h1{font-size:24px;margin-bottom:8px}h2{font-size:18px;margin:24px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px}
.card h3{font-size:14px;color:var(--text);opacity:0.7;margin-bottom:8px}
.card .val{font-size:28px;font-weight:700}
.green{color:var(--green)}.yellow{color:var(--yellow)}.red{color:var(--red)}.blue{color:var(--blue)}
.status{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:600}
.status.healthy{background:var(--green);color:#000}.status.degraded{background:var(--yellow);color:#000}.status.unhealthy{background:var(--red);color:#fff}
.loading{text-align:center;padding:40px;opacity:0.5}
.refresh{background:var(--blue);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{opacity:0.7;font-weight:600}
#errors{color:var(--red);font-size:14px}
</style>
</head>
<body>
<h1>🤖 aiPlat 系统概览</h1>
<p style="opacity:.5">实时状态 · 自动刷新 30s</p>
<button class="refresh" onclick="load()">🔄 刷新</button>

<div id="content" class="loading">加载中...</div>
<div id="errors"></div>

<script>
const API='http://localhost:8000';

async function load(){
    const el=document.getElementById('content');
    const err=document.getElementById('errors');
    err.textContent='';
    try{
        const [hl,di]=await Promise.all([
            fetch(API+'/api/diagnostics/health/all').then(r=>r.json()).catch(()=>null),
            fetch(API+'/api/diagnostics/guard/run',{method:'POST'}).then(r=>r.json()).catch(()=>null),
        ]);

        let html='<h2>🏥 四层健康</h2><div class="grid">';
        if(hl){
            for(const [layer,h] of Object.entries(hl)){
                const s=h.status||'unknown';
                html+=`<div class="card"><h3>${layer}</h3><div class="val ${s==='healthy'?'green':s==='degraded'?'yellow':'red'}">${s}</div></div>`;
            }
        }
        html+='</div>';

        // Verification pyramid
        html+='<h2>📊 L0-L5 自主性</h2><table>';
        html+='<tr><th>等级</th><th>名称</th><th>状态</th></tr>';
        const levels=[{l:'L5',n:'元循环工程',s:true},{l:'L4',n:'循环工程',s:true},{l:'L3',n:'驾驭工程',s:true},{l:'L2',n:'上下文工程',s:true},{l:'L1',n:'提示词工程',s:true},{l:'L0',n:'基础可执行',s:true}];
        levels.forEach(lv=>{html+=`<tr><td>${lv.l}</td><td>${lv.n}</td><td><span class="status ${lv.s?'healthy':'degraded'}">${lv.s?'✅':'⚠️'}</span></td></tr>`});
        html+='</table>';

        // Architecture guard
        if(di){
            const v=di.violations||[];
            html+=`<h2>🔒 架构守卫</h2>`;
            html+=`<div class="card"><h3>规则检查</h3><div class="val ${v.length===0?'green':'yellow'}">${v.length===0?'全部通过':'⚠️'+v.length+' 违规'}</div></div>`;
            html+=`<p style="margin-top:8px;opacity:.7">总计 ${di.summary?.total_checks||'?'} 条规则</p>`;
        }

        el.innerHTML=html;
    }catch(e){
        el.innerHTML='<div class="loading">无法连接 aiPlat (8000 端口未启动?)</div>';
        err.textContent=e.message;
    }
}
load();
setInterval(load,30000);
</script>
</body>
</html>
