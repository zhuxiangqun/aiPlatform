[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    constitution: architecture constitution tests (cross-layer boundary enforcement)
    layer_boundary: tests checking that layers don't violate import/access rules
    kernel_agnostic: tests checking core/infra don't contain application knowledge
    integration: integration tests requiring live services
    unit: unit tests that run without external dependencies
