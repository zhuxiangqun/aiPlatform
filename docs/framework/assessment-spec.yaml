          - {id: B2, desc: "信息源数量(CRAG 3级回退)", declared_level: L5, source: script,
             evidence: {command: "grep -c 'CRAG' aiPlat-core/core/apps/agents/materials_chat.py", op: "-ge", expected: 3}}
          - {id: B3, desc: "自适应路由(AdaptiveContextRouter)", declared_level: L5, source: script,
             evidence: {command: "grep -c 'class AdaptiveContextRouter' aiPlat-core/core/harness/knowledge/adaptive_context.py", op: "-ge", expected: 1}}
      - id: C
