# aiPlat 评估框架单一事实源 (assessment-spec.yaml)
#
# 唯一权威的框架评分定义。由 scripts/compute_assessment.py 读取:
#   1. 跑 source=script/file_check 项的 evidence.command → 验证 declared 值是否仍有证据支撑
#   2. 按 weighting 公式确定性计算综合分 (不推导 L 级/分数, 只聚合已声明值)
#   3. declared 值有声明但证据命令 FAIL → 记入 drift 报告
#
# 迁移决策 (2026-07-06, 三陷阱处置):
#   陷阱1: evidence.command 用 verify-l4-*.sh 的完整路径可运行版 (相对 repo 根)
#   陷阱2: 判断项诚实标 source=manual (verified:null); 能查文件的标 file_check; 能grep的标 script
#   陷阱3: scoring-detail.md 内部矛盾项取加权表值 + 注释标记, 综合分由公式算 (不手填)
#
# L 级仍是人工判定 (declared_level), 程序不假装计算 L 级 — 只验证证据 + 一致聚合。

spec_version: "1.0.0"
generated_at: "2026-07-06"
source_doc: "docs/framework/scoring-detail.md"

weighting:
  framework_one:
    method: weighted_avg_normalized          # sum(level*weight)/sum(weight)
    level_map: {L1: 1, L2: 2, L3: 3, L4: 4, L5: 5}
  framework_two:
    method: percentage                        # ("yes"*1 + "partial"*0.5)/total * 100
    result_map: {"yes": 1.0, "partial": 0.5, "no": 0.0}
  framework_three:
    method: mean_per_tier                     # 每层项分均值; 同时对比文档声明层分 → 查矛盾
    score_range: [0, 5]

frameworks:

  # ═══════════════════════════════════════════════════════════
  framework_one:
    name: "8轴自主性成熟度"
    axes:
      - id: A1
        name: "自执行闭环"
        declared_level: L4
        weight: 0.20
        items:
          - {id: A1.1, desc: "自愈多策略(5子策略)", declared_level: L3, source: script,
             evidence: {command: "grep -c 'async def _strategy_' aiPlat-core/core/harness/execution/pipeline_engine.py", op: "-ge", expected: 5},
             runtime_ref: {kind: live, label: "流水线自愈实际动作数", endpoint: "/diagnostics/repairs/history"}}
          - {id: A1.2, desc: "Goal循环(GoalExecutor)", declared_level: L4, source: script,
             evidence: {command: "grep -c 'class GoalExecutor' aiPlat-core/core/harness/optimization/goal_executor.py", op: "-ge", expected: 1},
             runtime_ref: {kind: file_count, label: "agent运行自动打分次数(P0-2)", command: "find ~/.aiplat/eval_results -name '*.json' 2>/dev/null | wc -l"}}
          - {id: A1.3, desc: "检查点回滚(ExecutionSnapshot)", declared_level: L4, source: script,
             evidence: {command: "grep -c 'class ExecutionSnapshot' aiPlat-core/core/harness/execution/snapshot.py", op: "-ge", expected: 1}}
          - {id: A1.4, desc: "零Token检测(wakeAgent) — 未实现", declared_level: null, source: gap}
      - id: A2
        name: "自调度编排"
        declared_level: L3
        weight: 0.15
        items:
          - {id: A2.1, desc: "状态流转(PipelineEngine)", declared_level: L3, source: script,
             evidence: {command: "grep -c 'class PipelineEngine' aiPlat-core/core/harness/execution/pipeline_engine.py", op: "-ge", expected: 1}}
          - {id: A2.2, desc: "多租户隔离(tenant_id 广布)", declared_level: L3, source: script,
             evidence: {command: "grep -rlE 'tenant_id' aiPlat-core/core --include=*.py | wc -l", op: "-ge", expected: 10}}
          - {id: A2.3, desc: "看板+Cron 定时调度(KanbanEngine+CronScheduler)", declared_level: L3, source: file_check,
             evidence: {command: "test -f aiPlat-core/core/harness/coordination/kanban_engine.py && test -f aiPlat-core/core/harness/scheduler/cron.py && test -f aiPlat-core/core/harness/scheduler/cron_loader.py && echo 3 || echo 0", op: "-ge", expected: 1}}
          - {id: A2.4, desc: "Profile命名空间隔离(MemoryManager namespace + Profile + skills workspace)", declared_level: L3, source: file_check,
             evidence: {command: "test -f aiPlat-core/core/harness/kernel/profile.py && grep -c 'namespace' aiPlat-core/core/harness/memory/manager.py", op: "-ge", expected: 1}}
      - id: B
        name: "上下文感知"
        declared_level: L5
