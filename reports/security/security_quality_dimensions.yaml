last_reviewed: "2026-11-09"
owner: "Product Security"
security_certification: false
honesty: "Matrix inventory only. ledger_ok ≠ accounted_ok ≠ release_ok ≠ coverage_ok ≠ certification."

status_legend:
  E: "evidence verified (code/test) — requires ≥1 evidence level V or T"
  I: "implemented, not independently verified"
  O: "owned but open"
  G: "gap / unowned"

evidence_levels:
  V: "verified in code path / design review with locatable artifact"
  T: "automated test asserts the control"
  D: "documentation only"
  U: "unknown / untested"
  A: "attested by external party"

