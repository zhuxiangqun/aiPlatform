name: aiPlat Contracts Guard

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]

jobs:
  contracts-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install packages (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./aiPlat-infra
          python -m pip install -e ./aiPlat-core
          python -m pip install -e ./aiPlat-platform

      - name: Contracts link check
        run: |
          python ./aiPlat-core/scripts/ci/check_contracts_guard.py links

      - name: System architecture docs guard
        run: |
          test -f ./docs/architecture/system-architecture-contract.md
          test -f ./docs/guides/PR_ARCHITECTURE_CHECKLIST.md
          test -f ./.github/pull_request_template.md

      - name: Contracts binding check (PR only)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python ./aiPlat-core/scripts/ci/check_contracts_guard.py binding --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Architecture contract guard (PR only)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # core.quotePath=false → Chinese filenames output as raw UTF-8 (not \xxx escapes)
          CHANGED="$(git -c core.quotePath=false diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "Changed files (base=$BASE_SHA head=$HEAD_SHA):"
          echo "$CHANGED"
          echo

          has_change () { echo "$CHANGED" | grep -E -q "$1"; }

          # Doc update predicates
          SYS_CONTRACT_UPDATED=false
          AUTH_SPEC_UPDATED=false
          RUN_SPEC_UPDATED=false
          SESSION_SPEC_UPDATED=false
          CORE_BOUNDARY_UPDATED=false

          if has_change '^docs/architecture/system-architecture-contract\.md$'; then SYS_CONTRACT_UPDATED=true; fi
          if has_change '^docs/standards/规范-platform-鉴权与身份透传\.md$'; then AUTH_SPEC_UPDATED=true; fi
          if has_change '^docs/standards/规范-core-run_id-trace_id-request_id\.md$'; then RUN_SPEC_UPDATED=true; fi
          if has_change '^docs/standards/规范-app-session_id与conversation_key\.md$'; then SESSION_SPEC_UPDATED=true; fi
          if has_change '^aiPlat-core/docs/contracts/01-architecture-contract\.md$|^aiPlat-core/docs/architecture/index\.md$'; then CORE_BOUNDARY_UPDATED=true; fi

          # 1) Auth / tenant / gateway / identity changes must update auth spec or system contract
          if has_change '^aiPlat-platform/(api|auth|gateway|tenants)/'; then
            if [ "$AUTH_SPEC_UPDATED" != "true" ] && [ "$SYS_CONTRACT_UPDATED" != "true" ]; then
              echo "ERROR: platform auth/tenant/gateway changed, but auth spec or system contract not updated."
              echo "Please update one of:"
              echo "- 规范-platform-鉴权与身份透传.md"
              echo "- docs/architecture/system-architecture-contract.md"
              exit 1
            fi
          fi

          # 2) Run/trace/request-id related runtime changes must update run spec or system contract
          if has_change '^aiPlat-core/core/(harness|services/execution_store\.py|harness/|api/routers)/'; then
            if [ "$RUN_SPEC_UPDATED" != "true" ] && [ "$SYS_CONTRACT_UPDATED" != "true" ]; then
              echo "ERROR: core runtime/run-trace surface changed, but run spec or system contract not updated."
              echo "Please update one of:"
              echo "- 规范-core-run_id-trace_id-request_id.md"
              echo "- docs/architecture/system-architecture-contract.md"
              exit 1
            fi
          fi

          # 3) Session/conversation contract changes must update session spec or system contract
          if has_change '^aiPlat-app/|^aiPlat-platform/|^aiPlat-core/core/api/routers/conversations\.py'; then
            if has_change 'conversation|session|conversations|scope'; then
              if [ "$SESSION_SPEC_UPDATED" != "true" ] && [ "$SYS_CONTRACT_UPDATED" != "true" ]; then
                echo "ERROR: session/conversation related code changed, but session spec or system contract not updated."
                echo "Please update one of:"
                echo "- 规范-app-session_id与conversation_key.md"
                echo "- docs/architecture/system-architecture-contract.md"
                exit 1
              fi
            fi
          fi

          # 4) Core boundary changes (harness/agents/skills) should update core boundary contract or system contract
          if has_change '^aiPlat-core/core/(harness|apps/agents|engine/skills)/'; then
            if [ "$CORE_BOUNDARY_UPDATED" != "true" ] && [ "$SYS_CONTRACT_UPDATED" != "true" ]; then
              echo "ERROR: core boundary surface changed (harness/agents/skills), but core boundary contract not updated."
              echo "Please update one of:"
              echo "- aiPlat-core/docs/contracts/01-architecture-contract.md"
              echo "- aiPlat-core/docs/architecture/index.md"
              echo "- docs/architecture/system-architecture-contract.md"
              exit 1
            fi
          fi

      - name: Architecture guard (grep-level)
        run: |
          bash ./scripts/architecture_guard.sh

      - name: Constitution tests (cross-layer)
        run: |
          python -m pip install pytest pytest-asyncio python-multipart
          python -m pytest tests/constitution/ -v --tb=short

      - name: Phase check (doc sync + wiring + dead code)
        run: |
          bash ./scripts/phase_check.sh

      - name: Generate capability impact matrix
        run: |
          python3 ./scripts/generate_impact_matrix.py
          if ! git diff --quiet -- docs/matrix/capability-impact-matrix.md; then
            echo "::warning::capability-impact-matrix.md drift detected — showing diff:"
            git diff -- docs/matrix/capability-impact-matrix.md | head -40 || true
          fi

      - name: Tool selection regression (gold dataset)
        working-directory: ./aiPlat-core
        run: |
          AIPLAT_EVAL_DRY_RUN=true \
          pytest -q core/tests/eval/test_tool_selection.py -m eval --tb=short

      - name: Skill quality regression (gold dataset)
        working-directory: ./aiPlat-core
        run: |
          AIPLAT_EVAL_DRY_RUN=true \
          pytest -q core/tests/eval/test_skill_quality.py -m eval --tb=short

      - name: Contracts acceptance tests
        working-directory: ./aiPlat-core
        run: |
          pytest -q \
            core/tests/unit/test_harness/test_llm_message_guard.py \
            core/tests/unit/test_harness/test_context_compaction.py \
            core/tests/unit/test_harness/test_context_shaping_pipeline.py \
            core/tests/unit/test_harness/test_auto_eval_prompt_includes_browser_evidence.py \
            core/tests/unit/test_harness/test_evidence_diff.py \
            core/tests/unit/test_harness/test_coverage_gate.py \
            core/tests/unit/test_harness/test_canary_escalation.py \
            core/tests/unit/test_harness/test_canary_recommendation.py \
            core/tests/unit/test_skills/test_generic_skill_json_output.py \
            core/tests/unit/test_skills/test_skillmanager_bridge_schema_to_registry.py \
            core/tests/unit/test_skills/test_skill_linter.py \
            core/tests/unit/test_skill_fix_proposals.py \
            core/tests/unit/test_skill_lint_scan_job_kind.py \
            core/tests/unit/test_skill_lint_alert_contract.py \
            core/tests/unit/test_apply_lint_fix_workspace.py \
            core/tests/integration/test_canary_block_release_candidate.py \
            core/tests/unit/test_harness/test_regression_gate_required_tags.py \
            core/tests/unit/test_harness/test_tag_assertions.py \
            core/tests/unit/test_harness/test_evaluator_workbench.py \
            core/tests/unit/test_harness/test_evaluation_policy_parse.py \
            core/tests/unit/test_harness/test_evaluation_policy_merge.py \
            core/tests/unit/test_docs/test_auto_eval_docs_guard.py \
            core/tests/unit/test_docs/test_auto_eval_openapi_snapshot_guard.py \
            core/tests/unit/test_docs/test_auto_eval_doc_openapi_section_guard.py \
            core/tests/unit/test_harness/test_executable_skill_policy_gate.py \
            core/tests/unit/test_harness/test_run_state_format.py \
            core/tests/unit/test_harness/test_run_state_merge_generates_todo.py \
            core/tests/unit/test_harness/test_run_state_auto_next_step_from_todo.py \
            core/tests/unit/test_harness/test_policy_denied_auto_retry.py \
            core/tests/unit/test_harness/test_tools_desc_budget.py \
            core/tests/unit/test_harness/test_skills_desc_budget.py \
            core/tests/unit/test_tool_search_tool.py \
            core/tests/unit/test_tools/test_skill_find_load_tools.py \
            core/tests/unit/test_gates/test_policy_gate_skill_load_permissions.py \
            core/tests/unit/test_skills/test_skill_kind_detection.py \
            core/tests/unit/test_skills/test_skill_installer.py \
            core/tests/unit/test_skills/test_skill_install_plan_token.py \
            core/tests/unit/test_exec_drivers/test_capabilities.py \
            core/tests/integration/test_phaseR1_prompt_assembler_layers_cache.py \
            core/tests/integration/test_phaseR1_prompt_mode.py

      - name: RAG quality regression test
        run: |
          python scripts/rag_eval_cli.py --all --threshold 0.5 || echo "::warning::RAG eval below threshold — review KB quality"

      - name: E2E API smoke test (warn-only)
        continue-on-error: true
        run: |
          python -m pip install pytest pytest-asyncio python-multipart httpx
          python -m pytest tests/e2e/ -v --tb=short || echo "::warning::E2E API smoke test failed"

  e2e-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: contracts-guard
    if: true  # Enabled: runs E2E tests in docker-compose.test.yml (warn-only, see continue-on-error)
    continue-on-error: true  # Docker runtime diagnostics — container startup needs manual env prep; do not block merges
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          # Dockerfiles use the repo root as build context (multi-repo pip install)
          docker build -t aiplat-core:latest -f aiPlat-core/Dockerfile .
          docker build -t aiplat-platform:latest -f aiPlat-platform/Dockerfile .
          docker build -t aiplat-management:latest -f aiPlat-management/Dockerfile .

      - name: Start services
        run: |
          docker compose -f docker-compose.test.yml up -d || {
            echo "::group::core container logs (startup failure)"
            docker compose -f docker-compose.test.yml logs core 2>&1 | tail -80
            echo "::endgroup::"
            echo "::group::platform container logs (startup failure)"
            docker compose -f docker-compose.test.yml logs platform 2>&1 | tail -80
            echo "::endgroup::"
            echo "::group::management container logs (startup failure)"
            docker compose -f docker-compose.test.yml logs management 2>&1 | tail -80
            echo "::endgroup::"
            docker compose -f docker-compose.test.yml down -v >/dev/null 2>&1 || true
            exit 1
          }

      - name: Wait for health
        run: |
          bash scripts/wait_for_health.sh 60 || {
            echo "::group::platform container logs (not healthy)"
            docker compose -f docker-compose.test.yml logs platform 2>&1 | tail -60
            echo "::endgroup::"
            echo "::group::management container logs (not healthy)"
            docker compose -f docker-compose.test.yml logs management 2>&1 | tail -60
            echo "::endgroup::"
            exit 1
          }

      - name: Run E2E tests
        run: |
          python -m pip install pytest pytest-asyncio httpx
          python -m pytest tests/e2e/ -v --tb=short

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
