name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiPlat-core
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # commitlint needs HEAD~1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ../aiPlat-infra -e ".[dev]" ruff mypy radon || pip install ruff mypy radon
      - name: Ruff lint (new violations gate)
        run: |
          # 存量 36K+ 违规记录为已知债务（ci.yml 首次真正运行暴露），
          # 仅对新增 F821 违规做 ratchet 门禁；全量 ruff 作为 advisory。
          bash ../scripts/ruff_f821_ratchet.sh --check || bash ../scripts/ruff_f821_ratchet.sh --advisory
          ruff check core/ --ignore F821 --exit-zero || echo "⚠️ 存量 ruff 违规（advisory，见 baselines）"
      - name: MyPy type check
        run: mypy core/ --ignore-missing-imports || true
      - name: Radon complexity
        run: radon cc core/ -a -n C -e core/tests/*,__pycache__ 2>/dev/null | awk '/^[[:space:]]*C/ || /^[[:space:]]*D/ || /^[[:space:]]*E/ || /^[[:space:]]*F/ {print; c++} END {if(c>0){print c,"high-complexity blocks found"}}' || echo "⚠️ 存量复杂度 advisory"
      - name: Commitlint check (last commit)
        run: npx --yes commitlint --from HEAD~1 --to HEAD --config ../.commitlintrc.yaml

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [aiPlat-core, aiPlat-infra, aiPlat-platform]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          case "${{ matrix.component }}" in
            aiPlat-platform) pip install -e ../aiPlat-infra -e ../aiPlat-core -e "." pytest pytest-cov pytest-asyncio ;;
            aiPlat-core)     pip install -e ../aiPlat-infra -e ".[dev]" ;;
            *)               pip install -e ".[dev]" || pip install pytest pytest-cov ;;
          esac
      - name: Environment consistency (docker-compose)
        run: |
          if [ -f docker-compose.test.yml ]; then
            docker compose -f docker-compose.test.yml up -d
            sleep 5
            echo "Docker-compose test environment started"
          fi
      - name: Prepare test profile presets (CI env has no ~/.aiplat)
        run: |
          # Seed control profiles + ontology from repo templates.
          # cwd is matrix.component; core seeds live under aiPlat-core/.
          if [ "${{ matrix.component }}" = "aiPlat-core" ]; then
            SEED_ROOT="."
          else
            SEED_ROOT="../aiPlat-core"
          fi
          mkdir -p "${AIPLAT_PROFILE_DIR:-$HOME/.aiplat/profiles}"
          cp "$SEED_ROOT/workspace_seeds/profiles/control_presets.yaml" \
             "${AIPLAT_PROFILE_DIR:-$HOME/.aiplat/profiles}/control_presets.yaml"
          mkdir -p "$HOME/.aiplat/ontologies"
          cp "$SEED_ROOT/workspace_seeds/ontologies/ai-knowledge.yaml" \
             "$HOME/.aiplat/ontologies/ai-knowledge.yaml"
          echo "presets + ontology seeded from $SEED_ROOT"
      - name: Run tests
        # Keep ${{ }} out of this large script — GHA counts the whole run block
        # toward the 21000 expression limit once any ${{ }} appears (week-14).
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          # aiPlat-core: do NOT run all of core/tests/unit in PR yet — large
          # pre-existing red surface (maxfail tripped). PR proves:
          #   1) previously-broken modules collect
          #   2) focused suites for hermetic/import/slice signoff fixes
          # Full unit path stays on core-tests-nightly.yml until green.
          if [ "$COMPONENT" = "aiPlat-core" ]; then
            # Collect-only: prove harness.* → core.harness import rot is fixed
            # (execution/planning/integration still have pre-existing API drift).
            # Collect: previously broken imports + week-1 green track packages.
            # Expand list only when a package is full-green (see core/tests/KNOWN_UNIT_RED.md).
            COLLECT=(
              core/tests/unit/test_harness/test_observability.py
              core/tests/unit/test_harness/test_execution/test_loop.py
              core/tests/unit/test_harness/test_graphs/test_planning.py
