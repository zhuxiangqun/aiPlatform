name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiPlat-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]" || pip install ruff mypy radon
      - name: Ruff lint
        run: ruff check core/ --ignore F821
      - name: MyPy type check
        run: mypy core/ --ignore-missing-imports || true
      - name: Radon complexity
        run: radon cc core/ -a -n C -e core/tests/*,__pycache__ 2>/dev/null | awk '/^[[:space:]]*C/ || /^[[:space:]]*D/ || /^[[:space:]]*E/ || /^[[:space:]]*F/ {print; c++} END {if(c>0){print c,"high-complexity blocks found"; exit 1}}'
      - name: Commitlint check (last commit)
        run: npx --yes commitlint --from HEAD~1 --to HEAD --config .commitlintrc.yaml

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [aiPlat-core, aiPlat-infra, aiPlat-platform]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]" || pip install pytest pytest-cov
      - name: Environment consistency (docker-compose)
        run: |
          if [ -f docker-compose.test.yml ]; then
            docker compose -f docker-compose.test.yml up -d
            sleep 5
            echo "Docker-compose test environment started"
          fi
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short -q --cov=. --cov-report=xml --cov-fail-under=80
      - name: Run regression tests
        run: python -m pytest tests/ -v --tb=short -q -m regression 2>/dev/null || echo "No regression tests defined (informational)"
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.component }}
          path: ${{ matrix.component }}/coverage.xml

  depth-tests:
    name: L5 Depth Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiPlat-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e "." || true
      - name: Run L5 depth tests
        run: python -m pytest tests/autonomy/test_l5_capabilities.py -v --tb=short -q
      - name: ACP Smoke Test (IDE integration)
        run: bash scripts/test-acp-smoke.sh || echo "ACP smoke skipped (informational)"

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiPlat-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e "." || true
      - name: Run benchmarks
        run: bash scripts/benchmark-ci.sh
      - name: Stress test (informational)
        run: bash scripts/stress-test.sh localhost 5 20 2>/dev/null || echo "Stress test skipped (needs running instance)"

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [lint, test, depth-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push core image
        uses: docker/build-push-action@v5
        with:
          context: ./aiPlat-core
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/aiplat-core:latest
            ghcr.io/${{ github.repository }}/aiplat-core:${{ github.sha }}
            cache-from: type=gha
            cache-to: type=gha,mode=max
      - name: Deploy to staging
        if: false  # Enable when K8s cluster is available
        run: |
          echo "Deploying to staging..."
          kubectl set image deployment/aiplat-core \
            aiplat-core=ghcr.io/${{ github.repository }}/aiplat-core:${{ github.sha }} \
            -n aiplat --record
      - name: Notify release
        run: |
           bash scripts/notify-release.sh deployed "aiplat-core ${{ github.sha }}"

  dast:
    name: DAST Active Security Scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: ZAP Full Active Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: https://aiplat.local
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a -j -T 3 -m 30"
          issue_title: "OWASP ZAP DAST Active Scan"
        continue-on-error: true
      - name: Security Attack Simulation
        run: python scripts/security-attack-sim.py http://localhost:8000 2>/dev/null || echo "Attack sim skipped (needs running instance)"

