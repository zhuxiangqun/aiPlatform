name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiPlat-core
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # commitlint needs HEAD~1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ../aiPlat-infra -e ".[dev]" ruff mypy radon || pip install ruff mypy radon
      - name: Ruff lint (new violations gate)
        run: |
          # 存量 36K+ 违规记录为已知债务（ci.yml 首次真正运行暴露），
          # 仅对新增 F821 违规做 ratchet 门禁；全量 ruff 作为 advisory。
          bash ../scripts/ruff_f821_ratchet.sh --check || bash ../scripts/ruff_f821_ratchet.sh --advisory
          ruff check core/ --ignore F821 --exit-zero || echo "⚠️ 存量 ruff 违规（advisory，见 baselines）"
      - name: MyPy type check
        run: mypy core/ --ignore-missing-imports || true
      - name: Radon complexity
        run: radon cc core/ -a -n C -e core/tests/*,__pycache__ 2>/dev/null | awk '/^[[:space:]]*C/ || /^[[:space:]]*D/ || /^[[:space:]]*E/ || /^[[:space:]]*F/ {print; c++} END {if(c>0){print c,"high-complexity blocks found"}}' || echo "⚠️ 存量复杂度 advisory"
      - name: Commitlint check (last commit)
        run: npx --yes commitlint --from HEAD~1 --to HEAD --config ../.commitlintrc.yaml

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [aiPlat-core, aiPlat-infra, aiPlat-platform]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          case "${{ matrix.component }}" in
            aiPlat-platform) pip install -e ../aiPlat-infra -e ../aiPlat-core -e "." pytest pytest-cov pytest-asyncio ;;
            aiPlat-core)     pip install -e ../aiPlat-infra -e ".[dev]" ;;
            *)               pip install -e ".[dev]" || pip install pytest pytest-cov ;;
          esac
      - name: Environment consistency (docker-compose)
        run: |
          if [ -f docker-compose.test.yml ]; then
            docker compose -f docker-compose.test.yml up -d
            sleep 5
            echo "Docker-compose test environment started"
          fi
      - name: Prepare test profile presets (CI env has no ~/.aiplat)
        run: |
          # Seed control profiles + ontology from repo templates.
          # cwd is matrix.component; core seeds live under aiPlat-core/.
          if [ "${{ matrix.component }}" = "aiPlat-core" ]; then
            SEED_ROOT="."
          else
            SEED_ROOT="../aiPlat-core"
          fi
          mkdir -p "${AIPLAT_PROFILE_DIR:-$HOME/.aiplat/profiles}"
          cp "$SEED_ROOT/workspace_seeds/profiles/control_presets.yaml" \
             "${AIPLAT_PROFILE_DIR:-$HOME/.aiplat/profiles}/control_presets.yaml"
          mkdir -p "$HOME/.aiplat/ontologies"
          cp "$SEED_ROOT/workspace_seeds/ontologies/ai-knowledge.yaml" \
             "$HOME/.aiplat/ontologies/ai-knowledge.yaml"
          echo "presets + ontology seeded from $SEED_ROOT"
      - name: Run tests
        run: |
          # aiPlat-core: do NOT run all of core/tests/unit in PR yet — large
          # pre-existing red surface (maxfail tripped). PR proves:
          #   1) previously-broken modules collect
          #   2) focused suites for hermetic/import/slice signoff fixes
          # Full unit path stays on core-tests-nightly.yml until green.
          if [ "${{ matrix.component }}" = "aiPlat-core" ]; then
            # Collect-only: prove harness.* → core.harness import rot is fixed
            # (execution/planning/integration still have pre-existing API drift).
            # Collect: previously broken imports + week-1 green track packages.
            # Expand list only when a package is full-green (see core/tests/KNOWN_UNIT_RED.md).
            COLLECT=(
              core/tests/unit/test_harness/test_observability.py
              core/tests/unit/test_harness/test_execution/test_loop.py
              core/tests/unit/test_harness/test_graphs/test_planning.py
              core/tests/unit/test_harness/test_integration.py
              core/tests/unit/test_harness/test_feedback_loops.py
              core/tests/unit/test_harness/test_coordination
              core/tests/unit/test_harness/test_execution/test_langgraph_core.py
              core/tests/unit/test_persistence
              core/tests/unit/test_exec_drivers
              core/tests/unit/test_mcp
              core/tests/unit/test_docs
              core/tests/unit/test_harness/test_convergence
              core/tests/unit/test_harness/test_diagnostics
              core/tests/unit/test_permissions
              core/tests/unit/test_tools
              core/tests/unit/test_gates
              core/tests/unit/test_document_protocol.py
              core/tests/unit/test_approval_gate.py
              core/tests/unit/test_error_translator.py
              core/tests/unit/test_delegate_tool.py
              core/tests/unit/test_file_checkpoint.py
              core/tests/unit/test_conversation_summary.py
              core/tests/unit/test_dynamic_router.py
              core/tests/unit/test_dynamic_router_opt_in.py
              core/tests/unit/test_architecture_profile.py
              core/tests/unit/test_core_modules.py
              core/tests/unit/test_core_module_deps.py
              core/tests/unit/test_execution_modules.py
              core/tests/unit/test_execution_snapshot_facade.py
              core/tests/unit/test_data_recipes.py
              core/tests/unit/test_claude_md_enforcement.py
              core/tests/unit/test_claude_md_pre_reasoning_infer.py
              core/tests/unit/test_guard_regression.py
              core/tests/unit/test_graph_incremental_paths.py
              core/tests/unit/test_harness/test_ontology_engine
              core/tests/unit/test_autosmoke_dedup_and_callback.py
              core/tests/unit/test_governance_preview_permission_details.py
              core/tests/unit/test_harness/test_auto_done_finalize.py
              core/tests/unit/test_harness/test_backpressure_protocol.py
              core/tests/unit/test_harness/test_canary_escalation.py
              core/tests/unit/test_harness/test_canary_recommendation.py
              core/tests/unit/test_harness/test_cc_hooks_bridge.py
              core/tests/unit/test_harness/test_code_review_gold.py
              core/tests/unit/test_harness/test_coding_deliverable_veto.py
              core/tests/unit/test_harness/test_coding_intensity.py
              core/tests/unit/test_harness/test_coding_stage_defaults.py
              core/tests/unit/test_harness/test_context_compaction.py
              core/tests/unit/test_harness/test_context_engine_compaction.py
              core/tests/unit/test_harness/test_context_engine_project_context_policy.py
              core/tests/unit/test_harness/test_context_shaping_pipeline.py
              core/tests/unit/test_harness/test_coverage_gate.py
              core/tests/unit/test_harness/test_done_verify.py
              core/tests/unit/test_harness/test_evaluation_policy_merge.py
              core/tests/unit/test_harness/test_evaluation_policy_parse.py
              core/tests/unit/test_harness/test_event_bus_dlq_filter.py
              core/tests/unit/test_harness/test_evidence_diff.py
              core/tests/unit/test_harness/test_evidence_envelope.py
              core/tests/unit/test_harness/test_executable_skill_policy_gate.py
              core/tests/unit/test_harness/test_execute_session.py
              core/tests/tool_correctness/test_code_graph.py
              core/tests/integration/test_harness_integration.py
              core/tests/integration/test_phaseR1_repo_diff_context_injection.py
              core/tests/unit/test_agents
              core/tests/unit/test_utils
              core/tests/unit/test_api
              core/tests/unit/test_harness/test_eval_verdict.py
              core/tests/unit/test_harness/test_completion_receipt.py
              core/tests/unit/test_harness/test_circuit_half_open.py
            )
            python -m pytest "${COLLECT[@]}" --collect-only -q
            # Execute only suites green for this track (see KNOWN_UNIT_RED.md week list)
            python -m pytest -v --tb=short -q \
              core/tests/unit/test_harness/test_observability.py \
              core/tests/unit/test_harness/test_execution/test_loop.py \
              core/tests/unit/test_harness/test_graphs/test_planning.py \
              core/tests/unit/test_harness/test_integration.py \
              core/tests/unit/test_harness/test_feedback_loops.py \
              core/tests/unit/test_harness/test_coordination \
              core/tests/unit/test_harness/test_execution/test_langgraph_core.py \
              core/tests/unit/test_persistence \
              core/tests/unit/test_exec_drivers \
              core/tests/unit/test_mcp \
              core/tests/unit/test_docs \
              core/tests/unit/test_harness/test_convergence \
              core/tests/unit/test_harness/test_diagnostics \
              core/tests/unit/test_permissions \
              core/tests/unit/test_tools \
              core/tests/unit/test_gates \
              core/tests/unit/test_document_protocol.py \
              core/tests/unit/test_approval_gate.py \
              core/tests/unit/test_error_translator.py \
              core/tests/unit/test_delegate_tool.py \
              core/tests/unit/test_file_checkpoint.py \
              core/tests/unit/test_conversation_summary.py \
              core/tests/unit/test_dynamic_router.py \
              core/tests/unit/test_dynamic_router_opt_in.py \
              core/tests/unit/test_architecture_profile.py \
              core/tests/unit/test_core_modules.py \
              core/tests/unit/test_core_module_deps.py \
              core/tests/unit/test_execution_modules.py \
              core/tests/unit/test_execution_snapshot_facade.py \
              core/tests/unit/test_data_recipes.py \
              core/tests/unit/test_claude_md_enforcement.py \
              core/tests/unit/test_claude_md_pre_reasoning_infer.py \
              core/tests/unit/test_guard_regression.py \
              core/tests/unit/test_graph_incremental_paths.py \
              core/tests/unit/test_harness/test_ontology_engine \
              core/tests/unit/test_autosmoke_dedup_and_callback.py \
              core/tests/unit/test_governance_preview_permission_details.py \
              core/tests/unit/test_harness/test_auto_done_finalize.py \
              core/tests/unit/test_harness/test_backpressure_protocol.py \
              core/tests/unit/test_harness/test_canary_escalation.py \
              core/tests/unit/test_harness/test_canary_recommendation.py \
              core/tests/unit/test_harness/test_cc_hooks_bridge.py \
              core/tests/unit/test_harness/test_code_review_gold.py \
              core/tests/unit/test_harness/test_coding_deliverable_veto.py \
              core/tests/unit/test_harness/test_coding_intensity.py \
              core/tests/unit/test_harness/test_coding_stage_defaults.py \
              core/tests/unit/test_harness/test_context_compaction.py \
              core/tests/unit/test_harness/test_context_engine_compaction.py \
              core/tests/unit/test_harness/test_context_engine_project_context_policy.py \
              core/tests/unit/test_harness/test_context_shaping_pipeline.py \
              core/tests/unit/test_harness/test_coverage_gate.py \
              core/tests/unit/test_harness/test_done_verify.py \
              core/tests/unit/test_harness/test_evaluation_policy_merge.py \
              core/tests/unit/test_harness/test_evaluation_policy_parse.py \
              core/tests/unit/test_harness/test_event_bus_dlq_filter.py \
              core/tests/unit/test_harness/test_evidence_diff.py \
              core/tests/unit/test_harness/test_evidence_envelope.py \
              core/tests/unit/test_harness/test_executable_skill_policy_gate.py \
              core/tests/unit/test_harness/test_execute_session.py \
              core/tests/tool_correctness/test_code_graph.py \
              core/tests/apps/fde/test_slice_five_products.py \
              core/tests/unit/test_agents \
              core/tests/unit/test_utils \
              core/tests/unit/test_api \
              core/tests/unit/test_harness/test_eval_verdict.py \
              core/tests/unit/test_harness/test_completion_receipt.py \
              core/tests/unit/test_harness/test_circuit_half_open.py
          elif [ "${{ matrix.component }}" = "aiPlat-infra" ]; then
            python -m pytest infra/tests -m "not integration" -v --tb=short -q --cov=. --cov-report=xml
          else
            python -m pytest tests -m "not integration" -v --tb=short -q --cov=. --cov-report=xml
          fi
      - name: Run regression tests
        run: |
          if [ "${{ matrix.component }}" = "aiPlat-core" ]; then
            echo "core regression covered by focused unit/slice path above"
            exit 0
          elif [ "${{ matrix.component }}" = "aiPlat-infra" ]; then
            TEST_DIR="infra/tests"
          else
            TEST_DIR="tests"
          fi
          python -m pytest "$TEST_DIR" -v --tb=short -q -m regression 2>/dev/null || echo "No regression tests defined (informational)"
      - name: Upload coverage
        if: matrix.component != 'aiPlat-core'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.component }}
          path: ${{ matrix.component }}/coverage.xml

  depth-tests:
    name: L5 Depth Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiPlat-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ../aiPlat-infra -e ".[dev]" || pip install pytest pytest-asyncio pytest-cov
      - name: Run L5 depth tests
        run: python -m pytest tests/autonomy/test_l5_capabilities.py -v --tb=short -q
      - name: ACP Smoke Test (IDE integration)
        run: bash ../scripts/test-acp-smoke.sh || echo "ACP smoke skipped (informational)"

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiPlat-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ../aiPlat-infra -e ".[dev]" || true
      - name: Run benchmarks
        run: bash ../scripts/benchmark-ci.sh
      - name: Stress test (informational)
        run: bash ../scripts/stress-test.sh localhost 5 20 2>/dev/null || echo "Stress test skipped (needs running instance)"

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [lint, test, depth-tests]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR requires lowercase repository path; github.repository may contain capitals (aiPlatform).
      - name: Normalize image repository (lowercase)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/aiplat-core" >> "$GITHUB_OUTPUT"
      - name: Build and push core image
        uses: docker/build-push-action@v7
        with:
          # Dockerfile COPY aiPlat-infra + aiPlat-core; context must be repo root
          # (same as docker-compose.yml / contracts-guard e2e-docker).
          context: .
          file: aiPlat-core/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to staging
        if: false  # Enable when K8s cluster is available
        run: |
          echo "Deploying to staging..."
          kubectl set image deployment/aiplat-core \
            aiplat-core=${{ steps.image.outputs.name }}:${{ github.sha }} \
            -n aiplat --record
      - name: Notify release
        run: |
           bash scripts/notify-release.sh deployed "aiplat-core ${{ github.sha }}"

  dast:
    name: DAST Active Security Scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - name: ZAP Full Active Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: https://aiplat.local
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a -j -T 3 -m 30"
          issue_title: "OWASP ZAP DAST Active Scan"
        continue-on-error: true
      - name: Security Attack Simulation
        run: python scripts/security-attack-sim.py http://localhost:8000 2>/dev/null || echo "Attack sim skipped (needs running instance)"

