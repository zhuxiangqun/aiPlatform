name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiPlat-core
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # commitlint needs HEAD~1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ../aiPlat-infra -e ".[dev]" ruff mypy radon || pip install ruff mypy radon
      - name: Ruff lint (new violations gate)
        run: |
          # 存量 36K+ 违规记录为已知债务（ci.yml 首次真正运行暴露），
          # 仅对新增 F821 违规做 ratchet 门禁；全量 ruff 作为 advisory。
          bash ../scripts/ruff_f821_ratchet.sh --check || bash ../scripts/ruff_f821_ratchet.sh --advisory
          ruff check core/ --ignore F821 --exit-zero || echo "⚠️ 存量 ruff 违规（advisory，见 baselines）"
      - name: MyPy type check
        run: mypy core/ --ignore-missing-imports || true
      - name: Radon complexity
        run: radon cc core/ -a -n C -e core/tests/*,__pycache__ 2>/dev/null | awk '/^[[:space:]]*C/ || /^[[:space:]]*D/ || /^[[:space:]]*E/ || /^[[:space:]]*F/ {print; c++} END {if(c>0){print c,"high-complexity blocks found"}}' || echo "⚠️ 存量复杂度 advisory"
      - name: Commitlint check (last commit)
        run: npx --yes commitlint --from HEAD~1 --to HEAD --config ../.commitlintrc.yaml

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [aiPlat-core, aiPlat-infra, aiPlat-platform]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          case "${{ matrix.component }}" in
            aiPlat-platform) pip install -e ../aiPlat-infra -e ../aiPlat-core -e "." pytest pytest-cov pytest-asyncio ;;
            aiPlat-core)     pip install -e ../aiPlat-infra -e ".[dev]" ;;
            *)               pip install -e ".[dev]" || pip install pytest pytest-cov ;;
          esac
      - name: Environment consistency (docker-compose)
        run: |
          if [ -f docker-compose.test.yml ]; then
            docker compose -f docker-compose.test.yml up -d
            sleep 5
            echo "Docker-compose test environment started"
          fi
      - name: Prepare test profile presets (CI env has no ~/.aiplat)
        run: |
          # Seed control profiles + ontology from repo templates.
          # cwd is matrix.component; core seeds live under aiPlat-core/.
          if [ "${{ matrix.component }}" = "aiPlat-core" ]; then
            SEED_ROOT="."
          else
            SEED_ROOT="../aiPlat-core"
          fi
          mkdir -p "${AIPLAT_PROFILE_DIR:-$HOME/.aiplat/profiles}"
          cp "$SEED_ROOT/workspace_seeds/profiles/control_presets.yaml" \
             "${AIPLAT_PROFILE_DIR:-$HOME/.aiplat/profiles}/control_presets.yaml"
          mkdir -p "$HOME/.aiplat/ontologies"
          cp "$SEED_ROOT/workspace_seeds/ontologies/ai-knowledge.yaml" \
             "$HOME/.aiplat/ontologies/ai-knowledge.yaml"
          echo "presets + ontology seeded from $SEED_ROOT"
      - name: Run tests
        run: |
          # aiPlat-core: run the real suite under core/tests/unit (not the thin
          # aiPlat-core/tests/ tree). Integration/slow stay for nightly.
          if [ "${{ matrix.component }}" = "aiPlat-core" ]; then
            TEST_DIR="core/tests/unit"
            KARGS=(-m "not integration and not slow")
            KARGS+=(-k "not test_best_model_for_purpose_works and not test_finalize_grilling_returns_structured")
          elif [ "${{ matrix.component }}" = "aiPlat-infra" ]; then
            TEST_DIR="infra/tests"
            KARGS=(-m "not integration")
          else
            TEST_DIR="tests"
            KARGS=(-m "not integration")
          fi
          # aiPlat-core unit tree is large: skip whole-tree --cov=. in PR (was
          # hanging 30m+). Coverage artifact remains for infra/platform only.
          # 80% hard gate still deferred.
          if [ "${{ matrix.component }}" = "aiPlat-core" ]; then
            python -m pytest "$TEST_DIR" "${KARGS[@]}" -v --tb=short -q \
              --maxfail=30
          else
            python -m pytest "$TEST_DIR" "${KARGS[@]}" -v --tb=short -q --cov=. --cov-report=xml
          fi
      - name: Run regression tests
        run: |
          if [ "${{ matrix.component }}" = "aiPlat-core" ]; then
            TEST_DIR="core/tests/unit"
          elif [ "${{ matrix.component }}" = "aiPlat-infra" ]; then
            TEST_DIR="infra/tests"
          else
            TEST_DIR="tests"
          fi
          python -m pytest "$TEST_DIR" -v --tb=short -q -m regression 2>/dev/null || echo "No regression tests defined (informational)"
      - name: Upload coverage
        if: matrix.component != 'aiPlat-core'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.component }}
          path: ${{ matrix.component }}/coverage.xml

  depth-tests:
    name: L5 Depth Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiPlat-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ../aiPlat-infra -e ".[dev]" || pip install pytest pytest-asyncio pytest-cov
      - name: Run L5 depth tests
        run: python -m pytest tests/autonomy/test_l5_capabilities.py -v --tb=short -q
      - name: ACP Smoke Test (IDE integration)
        run: bash ../scripts/test-acp-smoke.sh || echo "ACP smoke skipped (informational)"

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiPlat-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ../aiPlat-infra -e ".[dev]" || true
      - name: Run benchmarks
        run: bash ../scripts/benchmark-ci.sh
      - name: Stress test (informational)
        run: bash ../scripts/stress-test.sh localhost 5 20 2>/dev/null || echo "Stress test skipped (needs running instance)"

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [lint, test, depth-tests]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR requires lowercase repository path; github.repository may contain capitals (aiPlatform).
      - name: Normalize image repository (lowercase)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/aiplat-core" >> "$GITHUB_OUTPUT"
      - name: Build and push core image
        uses: docker/build-push-action@v7
        with:
          # Dockerfile COPY aiPlat-infra + aiPlat-core; context must be repo root
          # (same as docker-compose.yml / contracts-guard e2e-docker).
          context: .
          file: aiPlat-core/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to staging
        if: false  # Enable when K8s cluster is available
        run: |
          echo "Deploying to staging..."
          kubectl set image deployment/aiplat-core \
            aiplat-core=${{ steps.image.outputs.name }}:${{ github.sha }} \
            -n aiplat --record
      - name: Notify release
        run: |
           bash scripts/notify-release.sh deployed "aiplat-core ${{ github.sha }}"

  dast:
    name: DAST Active Security Scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - name: ZAP Full Active Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: https://aiplat.local
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a -j -T 3 -m 30"
          issue_title: "OWASP ZAP DAST Active Scan"
        continue-on-error: true
      - name: Security Attack Simulation
        run: python scripts/security-attack-sim.py http://localhost:8000 2>/dev/null || echo "Attack sim skipped (needs running instance)"

