name: Defect Gate

# PR-only: after merge, HEAD equals origin/main and the merge diff is empty,
# which would invalidate a PR-scoped receipt. Branch protection covers the PR.
on:
  pull_request:
    branches: [main]

jobs:
  defect-gate:
    name: Zero-findings receipt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate defect-gate receipt against PR merge diff
        run: |
          set -euo pipefail
          if [[ ! -f .aiplat/defect_gate/receipt.json ]]; then
            echo "::error::Missing .aiplat/defect_gate/receipt.json"
            echo "Run the defect-gate skill, commit a pass receipt, and push."
            exit 1
          fi
          BASE_REF="${{ github.base_ref }}"
          git fetch origin "$BASE_REF"
          python3 scripts/defect_gate_validate.py --base "origin/$BASE_REF" --allow-dirty
      - name: Show receipt summary
        if: always()
        run: |
          if [[ -f .aiplat/defect_gate/receipt.json ]]; then
            python3 -c "import json; d=json.load(open('.aiplat/defect_gate/receipt.json')); print('status=', d.get('status'), 'findings=', d.get('findings_count'), 'diff=', str(d.get('diff_sha256',''))[:12], 'base=', str(d.get('merge_base',''))[:12])"
          fi
