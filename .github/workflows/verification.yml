name: L5 Verification Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # P1-B13: schedule removed — daily cron was red for consecutive days (8-12~8-15)
  # and added noise to the required-status-checks context list. Verification now
  # runs on push/PR only (where it gates merges). Re-enable cron once the suite
  # is green in CI consistently.
  # schedule:
  #   - cron: "0 6 * * *"

jobs:
  pyramid:
    name: Level Pyramid (L0→L5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install pyyaml
      - name: Run pyramid verification
        run: bash scripts/verify-l4-pyramid.sh

  depth:
    name: Depth Tests (30 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pyyaml pytest pytest-asyncio
          pip install -e ./aiPlat-infra 2>/dev/null || true
          pip install -e ./aiPlat-core 2>/dev/null || true
      - name: Run depth verification
        run: bash scripts/verify-l4-depth.sh

  claims:
    name: Data Claims (31 checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install pyyaml
      - name: Run claims verification
        run: bash scripts/verify-l4-claims.sh

  references:
    name: Code References (28 refs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install pyyaml
      - name: Run reference verification
        run: bash scripts/verify_whitepaper_refs.sh

  vuln-sla:
    name: Vulnerability SLA Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pyyaml
          pip install -e ./aiPlat-infra 2>/dev/null || true
          pip install -e ./aiPlat-core 2>/dev/null || true
      - name: Check SLA breaches
        run: python -c "from core.harness.security.sla_tracker import check_and_exit; check_and_exit()"
