name: Docs Verify

on:
  pull_request:
    paths:
      - 'docs/**'
      - '*.md'
      - 'scripts/verify_docs.py'
      - '.github/workflows/docs-verify.yml'
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '*.md'
      - 'scripts/verify_docs.py'
      - '.github/workflows/docs-verify.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    name: Verify Documentation Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify docs
        id: docs_check
        continue-on-error: false
        run: python scripts/verify_docs.py

      - name: Post PR comment (warnings only)
        if: github.event_name == 'pull_request' && steps.docs_check.outputs.warnings != ''
        uses: actions/github-script@v7
        with:
          script: |
            const output = `⚠️ **文档验证告警**（不阻断合并）

            ${process.env.WARNING_MESSAGE}

            > 提示：数字变化（如能力数）无需手动修正，请确认是否预期。`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
        env:
          WARNING_MESSAGE: ${{ steps.docs_check.outputs.warnings }}
