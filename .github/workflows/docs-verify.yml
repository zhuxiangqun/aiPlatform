name: Docs Verify

on:
  pull_request:
    paths:
      - 'docs/**'
      - '*.md'
      - 'scripts/verify_docs.py'
      - '.github/workflows/docs-verify.yml'
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '*.md'
      - 'scripts/verify_docs.py'
      - '.github/workflows/docs-verify.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    name: Verify Documentation Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify docs
        id: docs_check
        continue-on-error: false
        run: |
          python scripts/verify_docs.py
          # Capture warnings for PR comment
          echo "warnings=$(python scripts/verify_docs.py 2>&1 | grep '⚠️' | head -20 | tr '\n' '|')" >> $GITHUB_OUTPUT

      - name: Check stale design docs
        id: stale_check
        if: github.event_name == 'pull_request'
        run: |
          # Find design docs with last_synced older than threshold
          DAYS="${AIPLAT_DOC_DESIGN_STALE_DAYS:-90}"
          # 2026-08-26 修复：内嵌多行 Python 抽到 scripts/verify_doc_stale.py
          # （YAML literal block 多行字符串缩进破坏解析——workflow 启动即失败）
          STALE=$(python3 scripts/verify_doc_stale.py "$DAYS")
          echo "stale_design=${STALE}" >> $GITHUB_OUTPUT
        env:
          AIPLAT_DOC_DESIGN_STALE_DAYS: ${{ vars.AIPLAT_DOC_DESIGN_STALE_DAYS || '90' }}

      - name: Post PR comment (warnings only)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const warnings = process.env.WARNING_MESSAGE || '';
            const staleDesign = process.env.STALE_DESIGN || '';

            let body = '';

            if (warnings) {
              body += `⚠️ **文档验证告警**（不阻断合并）\n\n${warnings}\n\n`;
            }

            if (staleDesign) {
              body += `📝 **设计文档提醒**（${process.env.STALE_THRESHOLD || '90'} 天未同步）\n\n以下文件可能需要更新：\n${staleDesign}\n\n> 请确认内容是否仍然准确。`;
            }

            if (body) {
              body += '\n> 提示：数字变化（如能力数）无需手动修正。';
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
        env:
          WARNING_MESSAGE: ${{ steps.docs_check.outputs.warnings }}
          STALE_DESIGN: ${{ steps.stale_check.outputs.stale_design }}
          STALE_THRESHOLD: ${{ vars.AIPLAT_DOC_DESIGN_STALE_DAYS || '90' }}
