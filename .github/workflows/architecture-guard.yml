name: Architecture Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guard:
    name: Architecture Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pyyaml pytest pytest-asyncio python-multipart
          pip install -e ./aiPlat-infra 2>/dev/null || true
          pip install -e ./aiPlat-core 2>/dev/null || true
          pip install -e ./aiPlat-platform 2>/dev/null || true
      - name: Run architecture guard
        run: bash scripts/architecture_guard.sh
        env:
          # 评测观测产物（HarnessEval 落地）：守卫运行时落盘证据树 + 路由决策 trace，
          # 上传为 CI artifact 供审计（为什么过/为什么挂、跳过了哪些检查）。
          AIPLAT_EVIDENCE_TREE_OUT: ${{ runner.temp }}/eval_artifacts/evidence_tree.json
          AIPLAT_GUARD_TRACE_OUT: ${{ runner.temp }}/eval_artifacts/guard_trace.json
      - name: Upload evaluation artifacts (evidence tree + route trace)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-artifacts
          path: |
            ${{ runner.temp }}/eval_artifacts/evidence_tree.json
            ${{ runner.temp }}/eval_artifacts/guard_trace.json
          if-no-files-found: ignore
      - name: Golden sample verify (P0-C7 — rules must have real hits)
        run: python3 scripts/rule_golden_sample.py --verify
      - name: Run constitution tests
        run: python -m pytest tests/constitution/ -v --tb=short -q

  wiring:
    name: Wiring Completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pyyaml pytest pytest-asyncio python-multipart
          pip install -e ./aiPlat-infra 2>/dev/null || true
          pip install -e ./aiPlat-core 2>/dev/null || true
      - name: Capability consumer verification (replaces deprecated caller_verify.sh)
        run: bash scripts/verify_capability_consumers.sh
      - name: Phase check
        run: bash scripts/phase_check.sh

  frontend:
    name: Frontend Proxy Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Frontend guard
        run: python scripts/guard_frontend.py

  frontmatter:
    name: YAML Frontmatter Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Validate frontmatter
        run: python scripts/validate_frontmatter.py --quick

  env-diff:
    name: Environment Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check environment consistency
        run: bash scripts/env-diff.sh

  vuln-sla:
    name: Vulnerability SLA Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiPlat-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pyyaml pytest pytest-asyncio python-multipart
          pip install -e ../aiPlat-infra 2>/dev/null || true
          pip install -e ../aiPlat-core 2>/dev/null || true
      - name: Check SLA breaches
        run: python -c "from core.harness.security.sla_tracker import check_and_exit; check_and_exit()"
