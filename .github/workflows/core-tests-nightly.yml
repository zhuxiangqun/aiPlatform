name: Core tests nightly (full)

on:
  schedule:
    - cron: "0 18 * * *"  # 03:00 JST
  workflow_dispatch:

jobs:
  # Hard gate: collection must succeed (0 error). Soft-fail full run lives in
  # a separate job so continue-on-error cannot hide import/collection rot.
  core-tests-collect:
    name: aiPlat-core core/tests (collect-only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aiPlat-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ../aiPlat-infra -e ".[dev]"
      - name: Collect-only (hard fail on import/collection error)
        env:
          AIPLAT_HOME: ${{ runner.temp }}/aiplat-home-nightly-collect
        run: |
          mkdir -p "$AIPLAT_HOME/profiles" "$AIPLAT_HOME/ontologies"
          cp workspace_seeds/profiles/control_presets.yaml "$AIPLAT_HOME/profiles/" 2>/dev/null || true
          cp workspace_seeds/ontologies/ai-knowledge.yaml "$AIPLAT_HOME/ontologies/" 2>/dev/null || true
          python -m pytest core/tests --collect-only -q

  core-tests-full:
    name: aiPlat-core core/tests (informational run)
    runs-on: ubuntu-latest
    needs: core-tests-collect
    # Informational until legacy unit reds are cleared; PR uses focused path.
    continue-on-error: true
    defaults:
      run:
        working-directory: aiPlat-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ../aiPlat-infra -e ".[dev]"
      - name: Unit/integration exclude (informational)
        env:
          AIPLAT_HOME: ${{ runner.temp }}/aiplat-home-nightly-full
        run: |
          mkdir -p "$AIPLAT_HOME/profiles" "$AIPLAT_HOME/ontologies"
          cp workspace_seeds/profiles/control_presets.yaml "$AIPLAT_HOME/profiles/" 2>/dev/null || true
          cp workspace_seeds/ontologies/ai-knowledge.yaml "$AIPLAT_HOME/ontologies/" 2>/dev/null || true
          python -m pytest core/tests -m "not integration and not slow" -v --tb=short -q \
            -k "not test_best_model_for_purpose_works and not test_finalize_grilling_returns_structured"
