# aiPlat pre-commit 框架配置
# 安装（二选一）:
#   1) bash scripts/install_git_hooks.sh
#      → 写入薄包装 .git/hooks/pre-commit，始终 exec scripts/pre-commit-hook.sh
#   2) pre-commit install
#      → 框架接管 .git/hooks/pre-commit，本文件 hooks 生效（同样走 comprehensive）
# 跳过: git commit --no-verify（§89 审计记录）
#
# 禁止手改 .git/hooks/pre-commit 正文。唯一真相源是 scripts/pre-commit-hook.sh
# （compile / cap / doc-sync / wiring / route / arch-guard / engine-guard / docstring）。
repos:
  - repo: local
    hooks:
      - id: aiplat-comprehensive
        name: aiPlat Comprehensive Pre-commit (10+ checks)
        entry: bash scripts/pre-commit-hook.sh
        language: system
        stages: [pre-commit]
        pass_filenames: false

      - id: bash-syntax
        name: Bash Syntax Check
        entry: bash -n
        language: system
        files: '\.sh$'

      - id: yaml-syntax
        name: YAML Frontmatter Syntax Check
        entry: python scripts/validate_frontmatter.py
        language: python
        files: '\.(yaml|yml|md)$'
        pass_filenames: false
