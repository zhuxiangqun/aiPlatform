{{- range $name, $svc := .Values }}
{{- if and (kindIs "map" $svc) (hasKey $svc "enabled") }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiplat.fullname" $ }}-{{ $name }}
  labels:
    {{- include "aiplat.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: {{ $svc.service.type | default "ClusterIP" }}
  ports:
    - port: {{ $svc.service.port }}
      targetPort: {{ $svc.service.port }}
      protocol: TCP
      name: {{ $name }}
  selector:
    app.kubernetes.io/name: {{ include "aiplat.name" $ }}
    app.kubernetes.io/component: {{ $name }}
{{- end }}
{{- end }}
{{- end }}
