# Phase D — valuable cross-domain view (resolver-native format)
# Merged into ~/.aiplat/ontologies/registry.json as cross_domain_views dict.
#
# CrossDomainResolver expects:
#   cross_domain_views: { view_name: { sources: [...], match_strategy: {...} } }
cross_domain_views:
  unified_customer:
    description: "锁安客户现场与售后客户对齐（有业务价值的跨域消歧）"
    sources:
      - domain: lock-service
        class: CustomerSite
      - domain: service-domain
        class: Customer
    match_strategy:
      primary: "customer_name||company_name||site_id||customer_id"
      secondary: "name"
      min_confidence: 0.70
    primary_domain: lock-service

semantic_modules:
  - id: Assignable
    description: "可派单 — InstallOrder / WorkOrder implements"
  - id: EvidencedCloseable
    description: "需证据关单 — 关闭前须证据"
