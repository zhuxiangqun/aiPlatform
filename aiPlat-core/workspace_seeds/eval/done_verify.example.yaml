# Example: PipelineStageConfig.done_verify / AGENT.md frontmatter overlay.
# Copy fields into stages[].done_verify or agent metadata — not loaded automatically.
#
# Seal DONE only after deterministic checks pass (Harness Verify ring).
done_verify:
  enabled: true
  min_output_length: 80
  reject_trivial_done: true
  reject_action_envelope: true
