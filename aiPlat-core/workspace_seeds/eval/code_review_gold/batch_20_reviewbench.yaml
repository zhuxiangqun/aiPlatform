# ReviewBench-style seed pack (40 cases) — copy to ~/.aiplat/eval/code_review_gold/
# or eval/tenants/{id}/code_review_gold/. Each case has ``predicted`` for --match-only.
# Expand ``target`` with real frozen PR diffs for live autoreview.
# Install: python3 scripts/eval_code_review_gold.py --install-seeds
cases:
  - id: sql_injection_auth
    description: "f-string SQL in auth"
    profile: balanced
    gold_findings:
      - {file: app/auth.py, line: 42, severity: P0, category: security, keywords: [sql, injection], description: "SQL via f-string"}
      - {file: app/auth.py, line: 88, severity: P1, category: security, keywords: [password, log], description: "Password logged"}
    predicted:
      - {file: app/auth.py, line: 41, severity: P0, description: "SQL injection f-string"}
      - {file: app/auth.py, line: 90, severity: P1, description: "plaintext password log"}

  - id: jwt_expiry_skew
    description: "JWT exp skew / none alg"
    profile: balanced
    gold_findings:
      - {file: app/jwt_util.py, line: 17, severity: P0, category: security, keywords: [jwt, none, alg], description: "alg=none accepted"}
      - {file: app/jwt_util.py, line: 44, severity: P1, category: security, keywords: [exp, skew], description: "no clock skew bound"}
    predicted:
      - {file: app/jwt_util.py, line: 18, severity: P0, description: "Accepts JWT alg none"}
      - {file: app/jwt_util.py, line: 45, severity: P1, description: "Missing exp leeway check"}

  - id: path_traversal_upload
    description: "upload path traversal"
    profile: high_coverage
    gold_findings:
      - {file: app/upload.py, line: 33, severity: P0, category: security, keywords: [path, traversal, ..], description: "Filename joins without sanitize"}
    predicted:
      - {file: app/upload.py, line: 33, severity: P0, description: "Path traversal via ../ in filename"}

  - id: ssrf_webhook
    description: "SSRF in webhook fetch"
    profile: high_coverage
    gold_findings:
      - {file: app/hooks.py, line: 55, severity: P0, category: security, keywords: [ssrf, url, metadata], description: "User URL fetched without allowlist"}
    predicted:
      - {file: app/hooks.py, line: 56, severity: P0, description: "SSRF: unrestricted outbound URL"}

  - id: xss_template_raw
    description: "XSS unescaped template"
    profile: balanced
    gold_findings:
      - {file: web/templates/page.html, line: 12, severity: P0, category: security, keywords: [xss, escape, html], description: "User HTML rendered raw"}
    predicted:
      - {file: web/templates/page.html, line: 12, severity: P0, description: "Unescaped user HTML XSS"}

  - id: csrf_state_missing
    description: "OAuth CSRF state missing"
    profile: balanced
    gold_findings:
      - {file: app/oauth.py, line: 71, severity: P1, category: security, keywords: [csrf, state, oauth], description: "OAuth callback ignores state"}
    predicted:
      - {file: app/oauth.py, line: 72, severity: P1, description: "Missing OAuth state validation"}

  - id: insecure_deserialize
    description: "pickle.loads on user blob"
    profile: high_coverage
    gold_findings:
      - {file: app/cache.py, line: 29, severity: P0, category: security, keywords: [pickle, deserialize], description: "pickle.loads untrusted"}
    predicted:
      - {file: app/cache.py, line: 29, severity: P0, description: "Insecure pickle deserialization"}

