global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "aiplat-core"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: "aiplat-core"

  - job_name: "aiplat-platform"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8001"]
        labels:
          service: "aiplat-platform"

  - job_name: "aiplat-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          service: "aiplat-app"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
