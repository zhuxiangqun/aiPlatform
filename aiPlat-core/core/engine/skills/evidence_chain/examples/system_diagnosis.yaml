name: "系统故障诊断"
sources:
  - name: "应用日志"
    type: file
    path: "/var/log/app/error.log"
    parser: "grep_log"
  - name: "Prometheus 指标"
    type: api
    endpoint: "http://prometheus:9090/api/v1/query"
    query: "up{job='aiplat'} == 0"
  - name: "告警记录"
    type: database
    table: "alerts"
    filter: "severity >= 'warning' AND created_at > now() - 1h"
verify:
  min_sources: 2
  contradiction_threshold: 0.3
  graph_cross_check: true
