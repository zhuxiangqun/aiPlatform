layer: core
rationale: |
  符合 boundary-standard.md §3.1（Internal Policy 归 Core）。
  Agent 基类、ReAct/PlanExecute/Conversational/RAG/MultiAgent 实现
  是通用 AI 运行时组件。任何对话、工具调用、多 Agent 协作都需要。
capabilities:
  - BaseAgent / ConfigurableAgent   # Agent 基类
  - ReActAgent                      # ReAct 推理-行动
  - ConversationalAgent             # 对话型 Agent
  - PlanExecuteAgent                # 规划-执行
  - RAGAgent                        # 检索增强生成
  - MultiAgent                      # 多 Agent 协作
