layer: core
rationale: |
  核心服务层 — 提供跨模块的持久化和业务服务：
  - execution_store: SQLite 持久化（runs/memory/sessions）
  - conversations: 对话会话管理
  - memory_store: 长期记忆存储
  - model_service: 模型管理

  所有服务通过 get_*() 工厂方法访问，通过 Dependency Injection 注入。
dependencies:
  - core.schemas_builder
  - core.harness                   # via DI container
