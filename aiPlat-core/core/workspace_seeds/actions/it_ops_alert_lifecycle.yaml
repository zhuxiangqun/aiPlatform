# it-ops alert triage L1 — open → triaging → rooted（对标 PPT 故障诊断，非 OWL）
actions:
  - action_id: "customer_action:it-ops:triage_alert"
    aliases: []
    label: "分诊告警"
    description: "告警 open → triaging；可挂 suspected_root"
    category: mutation
    scope: domain
    domain_id: it-ops
    target_class: 告警
    required_state: open
    effect_semantics: "Alert entered triage"
    compensation: "revert Alert.state to open"
    risk_level: low
    require_approval: false
    throttle_limit: 0
    action_namespace: customer_action
    eval_gate: customer_action_safety
    handler: "core.harness.ontology_engine.builtin_handlers:set_entity_state"
    input_schema:
      type: object
      required: [new_state]
      properties:
        new_state:
          type: string
          const: triaging
        suspected_root:
          type: string
          description: "疑似根因实体 ID（如 REDIS-1）"

  - action_id: "customer_action:it-ops:link_suspect"
    aliases: []
    label: "挂接疑似路径"
    description: "分诊中写 suspects 边 / path_note（状态保持 triaging）"
    category: mutation
    scope: domain
    domain_id: it-ops
    target_class: 告警
    required_state: triaging
    effect_semantics: "Record suspect hop on call path"
    compensation: "clear suspects edge"
    risk_level: low
    require_approval: false
    throttle_limit: 0
    action_namespace: customer_action
    eval_gate: customer_action_safety
    handler: "core.harness.ontology_engine.builtin_handlers:set_entity_state"
    input_schema:
      type: object
      required: [new_state, suspected_root]
      properties:
        new_state:
          type: string
          const: triaging
        suspected_root:
          type: string
        path_note:
          type: string
          description: "如 cast-query→cast-action→redis"

  - action_id: "customer_action:it-ops:mark_root_cause"
    aliases: []
    label: "确认根因"
    description: "告警 triaging → rooted；须 root_entity_id"
    category: mutation
    scope: domain
    domain_id: it-ops
    target_class: 告警
    required_state: triaging
    effect_semantics: "Root cause recorded"
    compensation: "revert Alert.state to triaging"
    risk_level: medium
    require_approval: false
    throttle_limit: 0
    action_namespace: customer_action
    eval_gate: customer_action_safety
    handler: "core.harness.ontology_engine.builtin_handlers:set_entity_state"
    input_schema:
      type: object
      required: [new_state, root_entity_id]
      properties:
        new_state:
          type: string
          const: rooted
        root_entity_id:
          type: string
          description: "根因实体 ID"
        path_note:
          type: string
