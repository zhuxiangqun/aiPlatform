    message: "未检测到 OpenTelemetry 埋点 — 建议接入 OTel + Prometheus 以提升可观测性 (§69)"

  # ═══ Section 70: Phase 1-3 Modules — 新能力接线守卫 (2026-06) ═══

  # 70.1: ParallelExecutor FanOut must be used where serial loops exist
