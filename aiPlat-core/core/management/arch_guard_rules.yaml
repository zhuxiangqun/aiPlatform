    section: "§74"
    section_name: "PatternCache.store — 必须在回答成功后存储执行模式"
    level: error
    check:
      type: grep_required
      pattern: 'pattern_cache.*store\|PatternCache.*store\|pcache\.store'
      paths: ["aiPlat-core/core/apps/agents/"]
      min_matches: 1
    message: "PatternCache.store() 未在任何 Agent 中调用 — 执行模式从未写入 (§5.4 模式晶体化)"

  # 74.3: SemanticCache.invalidate on KB reindex
  - id: semantic_cache_invalidate_on_reindex
    section: "§74"
    section_name: "SemanticCache 失效 — KB reindex 时必须清缓存"
    level: error
    check:
      type: grep_required
      pattern: 'invalidate_domain'
      paths: ["aiPlat-core/core/api/routers/knowledge.py"]
      min_matches: 1
    message: "KB reindex 不清除 SemanticCache — 可能返回过期缓存结果"

  # 74.4: ProvenanceScanner must cover programmatic write_page paths
  - id: provenance_scanner_in_write_page
    section: "§74"
    section_name: "ProvenanceScanner — write_page() 内部必须调用 on_source_updated"
    level: error
    check:
      type: grep_required
      pattern: 'ProvenanceScanner\|on_source_updated'
      paths: ["aiPlat-core/core/harness/knowledge/wiki_engine.py"]
      min_matches: 1
    message: "write_page() 未调用 ProvenanceScanner — 程序化 Wiki 更新不触发 stale 标记"

  # 74.5: No 'for o in str(o)' bug pattern anywhere
  - id: no_str_iteration_bug
    section: "§74"
    section_name: "防迭代 bug — 禁止 for o in str(collection) 模式"
    level: warning
    check:
      type: grep_forbidden
      pattern: 'for\s+\w+\s+in\s+str\('
      paths: ["aiPlat-core/core/"]
      max_matches: 0
    message: "发现 'for o in str(o)' 迭代 bug — 应改为 'for o in collection'"

  # 74.6: method_verify.sh must be integrated into architecture_guard.sh
  - id: method_verify_in_arch_guard
    section: "§74"
    section_name: "method_verify.sh — 必须集成到 architecture_guard.sh"
    level: error
    check:
      type: grep_required
      pattern: 'method_verify\|phase_check'
      paths: ["scripts/architecture_guard.sh"]
      min_matches: 1
    message: "method_verify.sh 或 phase_check.sh 未集成到 architecture_guard.sh"

  # 74.7: No known-debt TODO without tracking
  - id: no_untracked_debt_todos
    section: "§74"
    section_name: "已知债务 — TODO: wire / 0 caller 必须标注 noqa: known-debt 和 Phase"
    level: warning
    check:
      type: grep_forbidden
      pattern: 'TODO.*wire\b|0 caller|待接线'
      paths: ["aiPlat-core/core/harness/", "aiPlat-core/core/apps/", "aiPlat-core/core/services/", "aiPlat-core/core/gateway/"]
      max_matches: 0
    message: "发现未追踪的接线债务 — 标注为 'noqa: known-debt Phase X' 或立即修复"

