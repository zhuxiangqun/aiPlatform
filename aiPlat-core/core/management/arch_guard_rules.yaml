        violations=0
        for f in aiPlat-core/core/api/routers/fde_*.py 2>/dev/null; do
          plat_dir="aiPlat-platform/apps/fde/api/"
          if [ -d "$plat_dir" ]; then
            if grep -q "from core.api.routers" "$plat_dir"/*.py 2>/dev/null; then
              echo "ERROR: thin proxy detected in FDE module"
              violations=$((violations + 1))
            fi
          fi
        done
        [ "$violations" -eq 0 ] && echo "PASS: no thin proxy violations" || exit 1
      ok_pattern: "PASS:"

