  # ═══ Section 83: Untyped response_model Detection ═══
  - id: untyped_response_model
    section: "§83"
    section_name: "response_model=dict 检测"
    level: warning
    check:
      type: cmd_output
      cmd: |
        unt=0
        for f in aiPlat-core/core/api/routers/*.py aiPlat-platform/apps/*/api/*.py; do
          [ -f "$f" ] || continue
          # Count response_model=dict or response_model=None patterns
          count=$(grep -cE '@router\.\w+\(.*response_model\s*=\s*(dict|Dict|None|list|List)\b' "$f" 2>/dev/null || echo 0)
          if [ "$count" -gt 0 ]; then
            unt=$((unt + count))
          fi
        done
        if [ "$unt" -eq 0 ]; then
          echo "PASS: no untyped response_model"
        else
          echo "WARNING: $unt endpoint(s) use response_model=dict/None instead of typed schema (known debt H)"
        fi
      ok_pattern: "PASS:"

  # ═══ Section 84: App Module Directory Layout (per app-module-layout.md) ═══
  - id: app_module_layout_platform
    section: "§84"
    section_name: "App Module — platform/apps/{module}/ only allows api/ + __init__.py"
    level: error
    check:
      type: cmd_output
      cmd: |
        errs=0
        for mod_dir in aiPlat-platform/apps/*/; do
          mod=$(basename "$mod_dir")
          [ "$mod" = "__pycache__" ] && continue
          for f in "$mod_dir"*; do
            name=$(basename "$f")
            case "$name" in
              __init__.py|__pycache__|api) ;;
              *) errs=$((errs + 1)); echo "BAD: aiPlat-platform/apps/$mod/$name — only api/ + __init__.py allowed per app-module-layout.md" ;;
            esac
          done
        done
        [ "$errs" -eq 0 ] && echo "PASS: all platform module dirs compliant" || echo "FAIL: $errs violations"
      ok_pattern: "PASS:"

  - id: app_module_layout_core
    section: "§84"
    section_name: "App Module — core/apps/{module}/ only allows service/, prompts/, __init__.py (for registry modules)"
    level: error
    check:
      type: cmd_output
      cmd: |
        errs=0
        # Only check modules registered in apps.yaml (business app modules, not infra like agents/skills/tools)
        registered_mods=$(python3 -c "
        import yaml
        with open('aiPlat-platform/registry/apps.yaml') as f:
            data = yaml.safe_load(f)
        for m in data.get('modules',{}):
            print(m)
        " 2>/dev/null)
        for mod in $registered_mods; do
          mod_dir="aiPlat-core/core/apps/$mod"
          [ -d "$mod_dir" ] || continue
          for f in "$mod_dir"/*; do
            name=$(basename "$f")
            case "$name" in
              __init__.py|__pycache__|service|prompts|domain|skills|agents|BOUNDARY.yaml) ;;
              *) errs=$((errs + 1)); echo "BAD: $mod_dir/$name — only service/, prompts/, domain/, skills/, agents/, BOUNDARY.yaml, __init__.py allowed per app-module-layout.md" ;;
            esac
          done
        done
        [ "$errs" -eq 0 ] && echo "PASS: all core app modules compliant" || echo "FAIL: $errs violations"
      ok_pattern: "PASS:"

  # ══════════════════════════════════════════════════════════════
  # §86 Complete-But-Unwired Module Detection
  # Detects modules >80 lines with class/fn but zero production callers.
  # These are implementations waiting for a wiring point, NOT dead code.
  # ══════════════════════════════════════════════════════════════
  - id: complete_module_unwired
    section: "§86"
    section_name: "完整实现未接线检测"
    level: warning
    check:
      type: cmd_output
      cmd: |
        python3 -c "
        import json, subprocess
        result = subprocess.run(['python3', 'scripts/verify_l5_runtime.py', '--json'], capture_output=True, text=True, timeout=180)
        data = json.loads(result.stdout)
        unwired = [item for item in data['items'] if item['status'] == 'UNWIRED']
        if unwired:
            for u in unwired:
                print(f'UNWIRED: {u[\"name\"]} -- {u[\"file_ref\"]}')
            print(f'ERROR: {len(unwired)} complete implementations waiting for wiring')
            import sys; sys.exit(1)
        else:
            print('PASS: all complete implementations are wired')
        "
      ok_pattern: "PASS:"

  # ══════════════════════════════════════════════════════════════
  # §85 L5 Runtime Capability Verification
  # ══════════════════════════════════════════════════════════════
  - id: l5_runtime_verification
