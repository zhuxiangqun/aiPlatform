# Architecture Guard Rules — declarative config
# Add new grep checks here (6 lines each), zero code change.
#
# Supported check types:
#   grep_forbidden  grep for pattern, violations = every hit
#   grep_required   grep for pattern, violations = no hits
#   file_exists     check file/dir exists, violations = missing
#   file_forbidden  check filename pattern, violations = match
#   cmd_output      run shell cmd, check ok_pattern
#
# See arch_guard_base.py::ArchYAMLRule for full engine docs.

rules:
  # ═══ Section 1: Cross-Layer Import Direction (graph-optimized) ═══
  - id: layer_import_app_to_core
    section: "§1"
    section_name: "Cross-Layer Import Direction"
    level: error
    check:
      type: grep_graph_import
      from_pattern: "^aiPlat-app/"
      to_pattern: "^aiPlat-core/"
    message: "app imports core (must go through platform)"

  - id: layer_import_app_to_infra
    section: "§1"
    section_name: "Cross-Layer Import Direction"
    level: error
    check:
      type: grep_graph_import
      from_pattern: "^aiPlat-app/"
      to_pattern: "^aiPlat-infra/"
    message: "app imports infra (must go through platform)"

  - id: layer_import_platform_to_infra
    section: "§1"
    section_name: "Cross-Layer Import Direction"
    level: error
    check:
      type: grep_graph_import
      from_pattern: "^aiPlat-platform/"
      to_pattern: "^aiPlat-infra/"
    message: "platform imports infra (must go through core)"

  - id: layer_import_infra_to_internal
    section: "§1"
    section_name: "Cross-Layer Import Direction"
    level: error
    check:
      type: grep_graph_import
      from_pattern: "^aiPlat-infra/"
      to_pattern: "^(aiPlat-core/|aiPlat-platform/|aiPlat-app/|aiPlat-management/)"
    message: "infra imports internal layers (must be independent)"

  - id: layer_import_core_to_platform_app
    section: "§1"
    section_name: "Cross-Layer Import Direction"
    level: error
    check:
      type: grep_graph_import
      from_pattern: "^aiPlat-core/"
      to_pattern: "^(aiPlat-platform/|aiPlat-app/)"
    message: "core imports platform or app (reverse dependency)"

  # ═══ Section 2: Platform No Direct PipelineEngine ═══
  - id: platform_no_direct_engine
    section: "§2"
    section_name: "Platform — No Direct Engine Access"
    level: error
    check:
      type: grep_forbidden
      pattern: "PipelineEngine\\("
      paths: ["aiPlat-platform"]
      exclude: ["__pycache__", "tests/"]
    message: "platform directly instantiates PipelineEngine (use CoreFacade)"

  # ═══ Section 3: Core Harness Kernel Agnostic ═══
  - id: kernel_agnostic_artifact_keys
    section: "§3"
    section_name: "Core Harness — Kernel Agnostic"
    level: error
    check:
      type: grep_forbidden
      pattern: 'state\["prd"\]|state\["architecture"\]|state\["code"\]|state\["test_report"\]|state\["test_plan"\]|state\.get\("prd"|state\.get\("architecture"|state\.get\("code"|state\.get\("test_report"'
      paths: ["aiPlat-core/core/harness"]
      exclude: ["__pycache__", "tests/"]
    message: "hardcoded artifact keys in harness (use stage.output_artifact)"

  - id: kernel_agnostic_business_roles
    section: "§3"
    section_name: "Core Harness — Kernel Agnostic"
    level: error
    check:
      type: grep_forbidden
      pattern: '"pm_agent"|"architect_agent"|"programmer_agent"|"qa_agent"'
      paths: ["aiPlat-core/core/harness"]
      exclude: ["__pycache__", "tests/"]
    message: "hardcoded business role names in harness"

  - id: kernel_agnostic_scoring_dims
    section: "§3"
    section_name: "Core Harness — Kernel Agnostic"
    level: error
    check:
      type: grep_forbidden
      pattern: '"functionality"|"product_depth"|"design_ux"|"code_architecture"'
      paths: ["aiPlat-core/core/harness/evaluation"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["dimensions\\.py"]
    message: "hardcoded scoring dimensions (use PipelineStageConfig.scoring_dimensions)"

  - id: kernel_agnostic_sop_prompts
    section: "§3"
    section_name: "Core Harness — Kernel Agnostic"
    level: error
    check:
      type: grep_forbidden
      pattern: '"You are a strict.*evaluator|你是一个严格的'
      paths: ["aiPlat-core/core/harness/execution"]
      exclude: ["__pycache__", "tests/"]
    message: "business SOP prompts in engine (move to AGENT.md)"

  - id: kernel_agnostic_channel_adapters
    section: "§3"
    section_name: "Core Harness — Kernel Agnostic"
    level: error
    check:
      type: grep_forbidden
      pattern: "slack.*signature|verify_slack|slack_command|slack_events|response_url"
      paths: ["aiPlat-core/core"]
      exclude: ["__pycache__", "tests/"]
    message: "channel adapter logic in core (move to app)"

  - id: kernel_agnostic_chinese_names
    section: "§3"
    section_name: "Core Harness — Kernel Agnostic"
    level: error
    check:
      type: grep_forbidden
      pattern: '产品经理|架构师|程序员|测试员|前端开发|后端开发|项目经理|需求分析|系统设计|代码实现|测试评估'
      paths: ["aiPlat-core/core"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["orchestration/|kernel/types\\.py|prompt_loader\\.py|prompt_app\\.py"]
    message: "hardcoded Chinese business names in core (use config-driven)"

  # ═══ Section 4: Infra Application Agnostic ═══
  - id: infra_agnostic_app_names
    section: "§4"
    section_name: "Infra — Application Agnostic"
    level: error
    check:
      type: grep_forbidden
      pattern: '=.*"ai.platform|=.*"aiplat|=.*"aiPlat|=.*"ai-platform'
      paths: ["aiPlat-infra/infra"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["os\\.getenv|AIPLAT_"]
    message: "application-name defaults in infra (use env vars)"

  - id: infra_agnostic_gpu_models
    section: "§4"
    section_name: "Infra — Application Agnostic"
    level: error
    check:
      type: grep_forbidden
      pattern: '"A100"|"H100"|"V100"|"T4"|"A10G"'
      paths: ["aiPlat-infra/infra"]
      exclude: ["__pycache__", "tests/"]
    message: "GPU model name defaults in infra"

  - id: infra_agnostic_dev_paths
    section: "§4"
    section_name: "Infra — Application Agnostic"
    level: error
    check:
      type: grep_forbidden
      pattern: "/Users/"
      paths: ["aiPlat-infra/infra"]
      exclude: ["__pycache__", "tests/"]
    message: "developer paths in infra"

  - id: infra_agnostic_crypto_salts
    section: "§4"
    section_name: "Infra — Application Agnostic"
    level: error
    check:
      type: grep_forbidden
      pattern: "ai.platform.salt|ai-platform-salt|aiplat.*salt"
      paths: ["aiPlat-infra/infra"]
      exclude: ["__pycache__", "tests/"]
    message: "application-specific crypto salts in infra"

  # ═══ Section 5: App Layer Boundaries ═══
  - id: app_no_api_server
    section: "§5"
    section_name: "App — No API Server / No Direct DB"
    level: error
    check:
      type: grep_forbidden
      pattern: "FastAPI\\(|uvicorn\\.run\\("
      paths: ["aiPlat-app"]
      exclude: ["__pycache__", "tests/", "generated/", "api/rest/routes.py"]
    message: "app runs its own API server — api/rest/routes.py is a minimal health-only bootstrap, allowed per constitution"

  - id: app_no_direct_db
    section: "§5"
    section_name: "App — No API Server / No Direct DB"
    level: error
    check:
      type: grep_forbidden
      pattern: "sqlite3\\.connect|create_engine\\(|aiosqlite\\.connect"
      paths: ["aiPlat-app"]
      exclude: ["__pycache__", "tests/", "generated/"]
    message: "app accesses database directly (use platform API)"

  # ═══ Section 5.5: LangGraph Syscall Bypass ═══
  - id: langgraph_no_direct_syscall
    section: "§5.5"
    section_name: "LangGraph — No Direct Syscall Bypass"
    level: error
    check:
      type: grep_forbidden
      pattern: "sys_llm_generate|sys_tool_call|sys_skill_call"
      paths: ["aiPlat-core/core/harness/execution/langgraph"]
      exclude: ["__pycache__", "tests/", "compiled_graphs/react.py", "nodes/reason_node.py", "nodes/act_node.py", "nodes/observe_node.py"]
      grep_exclude: []
    message: "LangGraph nodes call syscalls directly (must delegate to Harness) — known exceptions per CLAUDE.md §5.23: react node, reason_node, act_node, observe_node are ReAct graph parallel implementation, to be retired in Phase 9"

  # ═══ Section 6: Core No Platform Routes ═══
  - id: core_no_platform_routes
    section: "§6"
    section_name: "Core — No Platform-Level Routes"
    level: error
    check:
      type: file_forbidden
      pattern: "approvals|tenant_policies|quota|permissions|onboarding|gateway|gate_policies|change_control|chat|channel_adapters|conversations|policy|ops_exports"
      paths: ["aiPlat-core/core/api/routers"]
    message: "core defines platform-level routes"

  # ═══ Section 10: Platform No AI Model Imports ═══
  - id: platform_no_model_imports
    section: "§10"
    section_name: "Platform — No Direct AI Model Imports"
    level: error
    check:
      type: grep_forbidden
      pattern: "import faster_whisper|import whisper|from whisper|import pytesseract|import paddleocr|import sentence_transformers|from sentence_transformers"
      paths: ["aiPlat-platform"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["kb/poc/ocr\\.py"]
    message: "platform directly imports AI model libraries (belongs in Core)"

  # ═══ Section 11: Platform KB No Own Parsers ═══
  - id: platform_kb_no_parsers
    section: "§11"
    section_name: "Platform KB — No Own Parsers"
    level: error
    check:
      type: grep_forbidden
      pattern: "def parse_docx|def parse_pptx|def parse_markdown|def classify_document|def _extract_keywords|def _score_text"
      paths: ["aiPlat-platform/kb/intelligence"]
      exclude: ["__pycache__", "tests/"]
    message: "platform implements own parsers/classifiers (belongs in core)"

  - id: platform_kb_no_embed_cache
    section: "§11"
    section_name: "Platform KB — No Own Parsers"
    level: error
    check:
      type: grep_forbidden
      pattern: "_EMBED_CACHE|_EMBED_CACHE_MAX"
      paths: ["aiPlat-platform/kb/intelligence"]
      exclude: ["__pycache__", "tests/"]
    message: "platform implements own embed cache (belongs in core)"

  # ═══ Section 12: Platform KB Retrieval Orchestration ═══
  - id: platform_query_retrieval_algo
    section: "§12"
    section_name: "Platform KB — Retrieval Orchestration Only"
    level: error
    check:
      type: grep_forbidden
      pattern: "def _cosine_similarity|def _dedupe|def retrieve|def _search_embedding|def _search_keyword"
      paths: ["aiPlat-platform/kb/intelligence/query.py"]
      exclude: ["__pycache__", "tests/"]
    message: "platform query.py implements retrieval algorithms (belongs in core)"

  - id: platform_video_retrieval_algo
    section: "§12"
    section_name: "Platform KB — Retrieval Orchestration Only"
    level: error
    check:
      type: grep_forbidden
      pattern: "def _cosine_similarity|def _dedupe|def retrieve|def _search_embedding|def _search_keyword"
      paths: ["aiPlat-platform/kb/intelligence/video_retrieval.py"]
      exclude: ["__pycache__", "tests/"]
    message: "platform video_retrieval.py implements retrieval algorithms (belongs in core)"

  # ═══ Section 13: Platform No Agent Discovery ═══
  - id: platform_no_agent_discovery
    section: "§13"
    section_name: "Platform — No Agent Discovery"
    level: error
    check:
      type: grep_forbidden
      pattern: "def _build_agent_catalog|def list_available_agents|def recommend_team_stages|_load_agent_md|_role_agent_md_path|def _scan_agent"
      paths: ["aiPlat-platform/builder"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["builder_roles\\.py|builder_project_service\\.py"]
    message: "platform implements agent discovery logic (belongs in Core)"

  # ═══ Section 21: Performance ═══
  - id: perf_sync_subprocess
    section: "§21"
    section_name: "Performance — Sync I/O in Async"
    level: error
    check:
      type: grep_forbidden
      pattern: "subprocess\\.run\\("
      paths: ["aiPlat-core/core/harness/execution"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["capture_output.*text.*timeout|# noqa|_write_file|git.*-C.*repo_root|f\"r = subprocess"]
    message: "synchronous subprocess.run in async context — known exceptions: _git_commit_stage (sync function), f-string template (not real call)"

  # ═══ Section 22: License ═══
  - id: license_copyleft
    section: "§22"
    section_name: "License — Copyleft Compliance"
    level: error
    check:
      type: grep_forbidden
      pattern: "(?i)gpl|agpl"
      paths: ["requirements.txt"]
      exclude: []
      ext: [".txt"]
    message: "copyleft-licensed packages detected"

  # ═══ Section 24: Secret Detection ═══
  - id: secret_detection
    section: "§24"
    section_name: "Secret Detection"
    level: error
    check:
      type: grep_forbidden
      pattern: '(?i)sk-[a-zA-Z0-9]{20,}|api[_-]?key\s*=\s*["\"][^"\"]{20,}["\"]|password\s*=\s*["\"][^"\"]{8,}["\"]|secret\s*=\s*["\"][^"\"]{8,}["\"]'
      paths: ["aiPlat-core", "aiPlat-platform", "aiPlat-infra", "aiPlat-app"]
      exclude: ["__pycache__", "tests/", ".env", "generated/"]
      ext: [".py", ".yml", ".yaml", ".json"]
      grep_exclude: ["mock-api-key|REPLACE_ME|example"]
    message: "potential hardcoded secrets detected (use env vars)"

  # ═══ Section 25: Error Swallowing ═══
  - id: error_swallowing
    section: "§25"
    section_name: "Error Handling — No Silent except:pass"
    level: error
    check:
      type: grep_forbidden
      pattern: "except Exception: pass"
      paths: ["aiPlat-core/core", "aiPlat-platform", "aiPlat-app"]
      exclude: ["__pycache__", "tests/", "generated/"]
      grep_exclude: ["# noqa|# allowed"]
    message: "bare except:pass — use logging at minimum"

  # ═══ Section 26: Security Hardcoded Credentials ═══
  - id: security_hardcoded_passwords
    section: "§26"
    section_name: "Security — No Hardcoded Credentials"
    level: error
    check:
      type: grep_forbidden
      pattern: 'password\s*:\s*"[^$]{3,}"'
      paths: ["."]
      exclude: ["__pycache__", "tests/", "node_modules", ".venv"]
      ext: [".yaml", ".yml", ".json"]
      grep_exclude: ["mock|example|REPLACE_ME"]
    message: "hardcoded passwords in config files (use env var references)"

  # ═══ Section 29: Infra No Vendor Strings ═══
  - id: infra_no_vendor_strings
    section: "§29"
    section_name: "Infra — No Vendor Hardware Strings"
    level: error
    check:
      type: grep_forbidden
      pattern: '"Apple Silicon"|"Apple M|M1|M2|M3|"A100"|"H100"|"V100"'
      paths: ["aiPlat-infra/infra"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["# noqa|# allowed"]
    message: "hardware vendor strings in infra defaults"

  # ═══ Section 30: Code Quality bare except ═══
  - id: code_quality_bare_except
    section: "§30"
    section_name: "Code Quality — No bare except:"
    level: error
    check:
      type: grep_forbidden
      pattern: "except\\s*:"
      paths: ["aiPlat-infra/infra"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["except Exception|except BaseException|except.*Error|except.*Warning|# noqa|# allowed"]
    message: "bare except: detected — use specific exception types"

  # ═══ Section 31: Code Quality datetime.now() ═══
  - id: code_quality_naive_datetime
    section: "§31"
    section_name: "Code Quality — datetime.now() timezone"
    level: error
    check:
      type: grep_forbidden
      pattern: "datetime\\.now\\(\\)"
      paths: ["aiPlat-infra/infra"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["timezone|utcnow|# noqa|# allowed"]
    message: "datetime.now() without timezone — use datetime.now(timezone.utc)"

  # ═══ Section 34: Hardcoded System Prompts ═══
  - id: hardcoded_system_roles
    section: "§34"
    section_name: "Hardcoded System Prompts"
    level: warning
    check:
      type: grep_forbidden
      pattern: '"role"\\s*:\\s*"system"'
      paths: ["aiPlat-core/core/harness"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["system_prompt|_sys_prompt|sys_prompt|test"]
    message: "hardcoded system role messages (use agent_config.system_prompt)"

  # ═══ Section 35: Agent Execute Path Uniqueness ═══
  - id: execute_path_uniqueness
    section: "§35"
    section_name: "Agent Execute Path Uniqueness"
    level: warning
    check:
      type: grep_forbidden
      pattern: "@router\\.(post|get|put)\\(.*\\{agent_id\\}/execute"
      paths: ["aiPlat-core/core/api/routers"]
      exclude: ["__pycache__", "tests/"]
    message: "duplicate execute endpoints detected (expect 2: engine + workspace — this is a permanent info-level warning, 2 is correct)"

  # ═══ Section 36: system_prompt Flow Integrity ═══
  - id: sysprompt_flow_corefacade
    section: "§36"
    section_name: "system_prompt Flow Integrity"
    level: error
    check:
      type: grep_required
      pattern: "agent_info.*system_prompt|cfg.*system_prompt|sys_prompt"
      paths: ["aiPlat-core/core/api/core_facade.py"]
      exclude: []
    message: "core_facade.py does not read system_prompt from agent config"

  - id: sysprompt_flow_stage_runner
    section: "§36"
    section_name: "system_prompt Flow Integrity"
    level: error
    check:
      type: grep_required
      pattern: "system_prompt|_sys_prompt"
      paths: ["aiPlat-core/core/harness/execution/langgraph/stage_runner.py"]
      exclude: []
    message: "stage_runner.py does not pass system_prompt to LoopState"

  - id: sysprompt_flow_loop
    section: "§36"
    section_name: "system_prompt Flow Integrity"
    level: error
    check:
      type: grep_required
      pattern: "system_prompt|_sys_prompt"
      paths: ["aiPlat-core/core/harness/execution/loop.py"]
      exclude: []
    message: "loop.py does not read system_prompt from context"

  # ═══ Section 37: 跨层能力重复检测 ═══
  - id: model_registry_centralized
    section: "§37"
    section_name: "跨层能力重复检测"
    level: error
    check:
      type: grep_forbidden
      pattern: "class\\s+ModelRegistry|def\\s+get_model_registry|get_default_for_purpose"
      paths: ["aiPlat-core/core/harness/"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["DEPRECATED|deprecated|infra_bridge|integration\\.py|model_router\\.py"]
    message: "core must not maintain own model registry (use infra ModelManager)"

  - id: capability_duplication_cross_layer
    section: "§37"
    section_name: "跨层能力重复检测"
    level: warning
    check:
      type: grep_forbidden
      pattern: "class\\s+\\w+(Model|LLM|Vector|Embedding|Database|Cache|Storage|Network|Compute)\\w*(?:Registry|Manager|Router)"
      paths: ["aiPlat-core/core/harness/"]
      exclude: ["__pycache__", "tests/", "integration.py", "model_registry.py", "model_router.py", "model_injection.py", "infra_bridge.py", "infrastructure/"]
    message: "potential cross-layer capability duplication — infra may already provide this"

  # ═══ Section 38: LLM API Bypass ═══
  - id: llm_api_bypass
    section: "§38"
    section_name: "LLM API 调用治理"
    level: error
    check:
      type: grep_forbidden
      pattern: "openai\\.ChatCompletion|openai\\.chat\\.completions|openai\\.completions|anthropic\\.(?!types|_version)|litellm\\.completion|google\\.generativeai|cohere\\.Client"
      paths: ["aiPlat-platform", "aiPlat-app"]
      exclude: ["__pycache__", "tests/", "generated/"]
      grep_exclude: ["# noqa: llm-approved"]
    message: "platform/app directly calling LLM API — use CoreFacade.llm_complete() or sys_llm_generate"

  # ═══ Section 39: Diagnostic Graph Rebuild ═══
  - id: diag_single_graph_build
    section: "§39"
    section_name: "诊断性能 — 代码图谱复用"
    level: error
    check:
      type: grep_forbidden
      pattern: "build_graph\\("
      paths: ["aiPlat-core/core/api/routers/diagnostics.py"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["_get_or_build_graph\\b", "build_graph_approved"]
    message: "diagnostics.py calls build_graph() — use _get_or_build_graph() instead"

  # ═══ Section 40: Dual-Mechanism Prevention (system-level) ═══

  # 40.1: No hardcoded model/provider — use centralized resolution
  - id: model_hardcode_dual_path
    section: "§40"
    section_name: "模型解析双路径防护"
    level: error
    check:
      type: grep_forbidden
      pattern: 'create_adapter\s*\(\s*provider\s*=\s*"'
      paths: ["aiPlat-core/"]
      exclude: ["__pycache__", "tests/", "adapters/llm/base.py", "harness/infrastructure/", "harness/knowledge/"]
      grep_exclude: ["# noqa: adapter-legacy", "# noqa: canonical-injection"]
    message: "hardcoded model provider in create_adapter() — use create_selected_adapter() or get_default_model()"

  # 40.2: No direct env var model reads bypassing centralized resolution
  - id: model_env_bypass
    section: "§40"
    section_name: "模型解析双路径防护"
    level: error
    check:
      type: grep_forbidden
      pattern: 'os\.getenv\s*\(\s*"AIPLAT_\w*MODEL\w*"\s*[,)]'
      paths: ["aiPlat-core/", "aiPlat-platform/"]
      exclude: ["__pycache__", "tests/", "harness/utils/model_injection.py",
                "harness/infrastructure/", "infra/"]
      grep_exclude: ["# noqa: env-legacy"]
    message: "direct env var read for AIPLAT_*_MODEL — use get_default_model() or create_selected_adapter()"

  # 40.3: No raw sqlite3.connect in core/api — use execution_store
  - id: raw_sqlite_api_layer
    section: "§40"
    section_name: "数据库双路径防护"
    level: error
    check:
      type: grep_forbidden
      pattern: 'sqlite3\.connect\s*\('
      paths: ["aiPlat-core/core/api/", "aiPlat-core/core/harness/syscalls/"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["execution_store", "infra_bridge", "# noqa: sqlite-approved",
                     "kb_eval\\.py", "packages_registry\\.py", "overview\\.py",
                     "prompt_eval\\.py", "prompt_app\\.py", "entropy\\.py",
                     "wiki\\.py", "diagnostics\\.py", "retrieval\\.py"]
    message: "raw sqlite3.connect() in API/syscall layer — use execution_store or infra_bridge"

  # 40.4: No hardcoded model name strings — use best_model_for_purpose() or create_selected_adapter()
  - id: model_name_hardcode
    section: "§40"
    section_name: "模型名称硬编码防护"
    level: error
    check:
      type: grep_forbidden
      pattern: '"(deepseek-chat|gpt-4[^a-z]|gpt-3\.5|deepseek-reasoner|claude-3)"'
      paths: ["aiPlat-core/", "aiPlat-platform/"]
      exclude: ["__pycache__", "tests/", "model_registry.py", "model_injection.py",
                "arch_guard_rules.yaml", "infra/", "agent_config_validator.py"]
      grep_exclude: ["# noqa: model-legacy", "# noqa: interface-default"]
    message: "hardcoded model name — use best_model_for_purpose() or create_selected_adapter()"

  # 40.5: No indirect workspace_context access — use ContextVar
  - id: indirect_workspace_context
    section: "§40"
    section_name: "上下文双路径防护"
    level: error
    check:
      type: grep_forbidden
      pattern: 'getattr\s*\([a-zA-Z_]+\s*,\s*["\u2018]workspace_context["\u2019]\s*[,\)]'
      paths: ["aiPlat-core/core/harness/"]
      exclude: ["__pycache__", "tests/", "kernel/execution_context.py", "tools/toolsets.py"]
    message: "indirect workspace_context attribute access — use get_active_workspace_context() ContextVar"

  # 40.5: No bare except:pass in gate paths (must log)
  - id: bare_except_pass_gate
    section: "§40"
    section_name: "静默吞错防护"
    level: warning
    check:
      type: grep_forbidden
      pattern: 'except Exception:\s*\n\s*pass'
      paths: ["aiPlat-core/core/harness/syscalls/", "aiPlat-core/core/api/routers/"]
      exclude: ["__pycache__", "tests/"]
    message: "bare except:pass in syscall/router — add logging.debug(exc_info=True) for diagnostics"

  # 40.6: No duplicate function signatures across syscall modules
  - id: duplicate_syscall_signatures
    section: "§40"
    section_name: "并行实现检测"
    level: warning
    check:
      type: grep_forbidden
      pattern: 'def create_adapter\b|def resolve_model\b|def get_model\b'
      paths: ["aiPlat-core/core/harness/syscalls/", "aiPlat-core/core/apps/"]
      exclude: ["__pycache__", "tests/", "adapters/llm/base.py"]
      grep_exclude: ["# re-export from", "import", "# noqa: agent-model"]
    message: "potential duplicate model resolution function — centralized resolution is in model_injection.py"

  # 40.7: No direct adapter model env var reads outside base_model_adapter.py
  # All capability model resolution must go through resolve_model_name() / create_adapter()
  - id: adapter_no_direct_model_env_var
    section: "§40"
    section_name: "适配器模型解析 — 禁止直接读 env var"
    level: error
    check:
      type: grep_forbidden
      pattern: '(AIPLAT_EMBEDDING_MODEL|AIPLAT_RERANK_MODEL|AIPLAT_VIDEO_WHISPER_MODEL|AIPLAT_VIDEO_OCR_MODEL)'
      paths: ["aiPlat-core/core/"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["base_model_adapter\\.py", "_MODEL_ENV_MAP|_MODEL_DEFAULTS", "infra_bridge", "# noqa: adapter-resolution"]
    message: "direct os.getenv read of adapter model env var — use resolve_model_name(capability) or create_adapter(capability) from base_model_adapter"

  # ═══ Section 41: Utilization Guard — detect dead/inactive mechanisms ═══
  # Catches patterns that existing architecture guard (§1-§40) cannot detect:
  # §1-§40 catch: "wrong pattern exists" (grep_forbidden)
  # §41 catches:    "initialized but never updated" / "0 callers" / "set but never read"
  #
  # Why existing guards missed these:
  # - architecture_guard: grep-based → can't check runtime state or caller counts
  # - diagnostics: SQL-based → aggregates data, doesn't detect dead wiring
  # - convergence_checker: AST-based → checks gate reachability, not utilization
  #
  # §41 fills the gap: static analysis of default values, callback assignments, dead code.

  # 41.1: Detect fields initialized to None and never reassigned
  - id: dead_callback_assignment
    section: "§41"
    section_name: "利用化守卫 — 死代码检测"
    level: error
    check:
      type: grep_forbidden
      pattern: 'self\._persist_callback\s*=\s*None'
      paths: ["aiPlat-core/core/harness/memory/"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["# wiring: active", "# noqa: pending-wire"]
    message: "_persist_callback is None — long-term memory persistence is disabled. Wire it or mark # noqa: pending-wire."

  # 41.2: Detect values initialized but never updated (budget_remaining, context_pressure, etc.)
  - id: dead_budget_tracking
    section: "§41"
    section_name: "利用化守卫 — 死代码检测"
    level: error
    check:
      type: grep_forbidden
      pattern: 'budget_remaining\s*[=:]\s*1\.0'
      paths: ["aiPlat-core/core/harness/interfaces/", "aiPlat-core/core/harness/execution/"]
      exclude: ["__pycache__", "tests/"]
    message: "budget_remaining initialized to 1.0 but never updated — token budget exhaustion is dead code. Add budget_remaining = 1.0 - used_tokens/max_tokens in _reason()."

  # 41.3: Detect DI registrations without corresponding di.resolve() calls
  - id: dead_di_registration
    section: "§41"
    section_name: "利用化守卫 — DI 容器"
    level: warning
    check:
      type: grep_forbidden
      pattern: 'di_factory\(\s*"AgentRegistry"|di_factory\(\s*"TraceService"|di_factory\(\s*"PermissionManager"|di_factory\(\s*"SubagentCoordinator"|di_factory\(\s*"IAgent"|di_factory\(\s*"ISkill"|di_factory\(\s*"ITool"'
      paths: ["aiPlat-core/core/harness/integration.py"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["# wiring: live", "# noqa: di-live"]
    message: "DI registration without di.resolve() caller — check if this service is actually used through DI"

  # 41.4: Detect env-var defaults that disable critical features
  - id: disabled_by_default
    section: "§41"
    section_name: "利用化守卫 — 默认禁用"
    level: warning
    check:
      type: grep_forbidden
      pattern: 'os\.getenv\("AIPLAT_APPLY_PROMPT_REVISIONS", "false"\)|os\.getenv\("AIPLAT_SYSCALL_ENFORCE_APPROVAL", "false"\)|os\.getenv\("AIPLAT_APPROVALS_DISABLED", "true"\)'
      paths: ["aiPlat-core/core/harness/syscalls/", "aiPlat-core/core/harness/infrastructure/"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["# noqa: planned-phase4", "# noqa: known-design"]
    message: "critical feature is disabled by default via env var — consider enabling by default"

  # 41.5: Detect threshold too high for practical use
  - id: impractical_threshold
    section: "§41"
    section_name: "利用化守卫 — 阈值过高"
    level: warning
    check:
      type: grep_forbidden
      pattern: 'AIPLAT_TOOL_SELECTOR_THRESHOLD", "1[5-9]"|"1[5-9]"'
      paths: ["aiPlat-core/core/harness/execution/tool_selector.py"]
      exclude: ["__pycache__", "tests/"]
    message: "tool selector threshold is too high for most sessions — uses default(15) which is a no-op. Consider 5-10."

  # ═══ Section 42: Subprocess Python Consistency ═══
  - id: subprocess_bare_python3
    section: "§42"
    section_name: "Subprocess — Python Binary Consistency"
    level: error
    check:
      type: grep_forbidden
      pattern: 'subprocess\.run\(\["python3"|subprocess\.run\(\["python"|asyncio\.create_subprocess_exec\("python3"|asyncio\.create_subprocess_exec\("python"'
      paths: ["aiPlat-core/core"]
      exclude: ["__pycache__", "tests/", "conftest.py"]
      grep_exclude: ["exec_drivers/docker\\.py", "exec_drivers/ssh\\.py", "capability_convergence\\.py", "arch_guard_rules/", "sys\\.executable", 'if.*command.*==.*"python3"', "scripts/architecture_guard\\.py"]
    message: "bare 'python3' in subprocess call — use sys.executable to ensure venv Python is used"

  # ═══ Section 43: Business-Agnostic Prompt & Logic ═══
  # 43.1: No hardcoded platform names in core logic — use config or frontmatter
  - id: kernel_agnostic_platform_names
    section: "§43"
    section_name: "Prompt & Logic — No Hardcoded Platforms"
    level: error
    check:
      type: grep_forbidden
      pattern: '"reddit"|"twitter"|"x "|"youtube"|"tiktok"|"instagram"|"hackernews"|"polymarket"'
      paths: ["aiPlat-core/core"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["prompt_loader\\.py", "prompt_app\\.py", "arch_guard_rules/", "skill_adapter\\.py"]
    message: "hardcoded platform name in core — use config-driven or relocate to AGENT.md/SKILL.md frontmatter"

  # 43.2: No hardcoded skill-name branching — use metadata/capabilities config
  - id: kernel_agnostic_skill_branching
    section: "§43"
    section_name: "Prompt & Logic — No Skill-Name Branches"
    level: error
    check:
      type: grep_forbidden
      pattern: 'skill_name in \[|name in \[".*last30days|name in \[".*skill'
      paths: ["aiPlat-core/core"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["arch_guard_rules/"]
    message: "hardcoded skill-name decision branch — use metadata/capabilities config instead"

  # 43.3: No hardcoded scenario examples in LLM prompts — use generic principles
  - id: kernel_agnostic_prompt_examples
    section: "§43"
    section_name: "Prompt & Logic — No Scenario Examples"
    level: error
    check:
      type: grep_forbidden
      pattern: '如果描述是|如果是搜索|例如.*skill.*就不要再|反例：如果'
      paths: ["aiPlat-core/core"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["arch_guard_rules/"]
    message: "hardcoded scenario example in LLM prompt — use generic principles instead of specific cases"

  # ═══ Section 44: Execution Realness — Skill / Mock Authenticity ═══
  # 44.1: Detect mock fallback in production code (must be gated by env var or audited)
  - id: mock_fallback_in_production
    section: "§44"
    section_name: "执行真实性 — mock 降级检测"
    level: error
    check:
      type: grep_forbidden
      pattern: '_mock_results\(|MockAdapter\(\)|"DONE: ok"'
      paths: ["aiPlat-core/core"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["base\\.py", "mock_adapter\\.py", "scripted_adapter\\.py", "arch_guard_rules/"]
    message: "mock fallback in production code — gate with env var or add audit log"

  # 44.2: Detect silent mock default in env var resolution (e.g. os.getenv(... or \"mock\"))
  - id: mock_default_in_env_resolution
    section: "§44"
    section_name: "执行真实性 — 默认 mock 检测"
    level: error
    check:
      type: grep_forbidden
      pattern: 'os\.getenv\(.*or\s+"mock"'
      paths: ["aiPlat-core/core"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["arch_guard_rules/"]
    message: "default mock value in env var resolution — use empty string instead or gate explicitly"

  # ═══ Section 45: Prompt Template — No Hardcoded Multi-Line Prompts ═══
  # 45.1: Detect hardcoded Chinese/English LLM system prompts in router/apps/platform code
  - id: prompt_hardcode_in_routers_apps
    section: "§45"
    section_name: "提示词模板 — 禁止硬编码多行 Prompt"
    level: error
    check:
      type: grep_forbidden
      pattern: '"你是一个|"你是 |"您是|"你的任务是|"你是一位|"You are a (helpful |)(assistant|expert|agent|developer|evaluator|helper|curator|planner)'
      paths: ["aiPlat-core/core/api/routers", "aiPlat-core/core/apps", "aiPlat-platform"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["prompt_loader\\.py", "prompt_app\\.py", "_async_prompt_resolve", "_sync_resolve", "_resolve_assemble", "system_prompt:", "arch_guard_rules/"]
    message: "hardcoded LLM prompt — register in prompt_loader.py via _register() and load via _async_prompt_resolve()"

  # 45.2: Detect users of system role dict for non-loader code paths
  - id: prompt_hardcode_system_role_dict
    section: "§45"
    section_name: "提示词模板 — 禁止硬编码 System Role"
    level: error
    check:
      type: grep_forbidden
      pattern: '\{"role":\s*"system",\s*"content":\s*"你是一|\{"role":\s*"system",\s*"content":\s*"你是 |\{"role":\s*"system",\s*"content":\s*"You are a'
      paths: ["aiPlat-core/core/api/routers", "aiPlat-core/core/apps"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["prompt_loader\\.py", "_async_prompt_resolve", "_sync_resolve", "arch_guard_rules/"]
    message: "hardcoded system role dict — use _async_prompt_resolve() to load from prompt_loader"

  # ═══ Section 46: Skill Execution Realness — Automated ═══
  # 46.1: Upgrade handler type without handler file from WARNING to ERROR
  - id: skill_handler_type_no_handler_file
    section: "§46"
    section_name: "执行真实性 — handler 缺失"
    level: error
    check:
      type: grep_forbidden
      pattern: 'execution_type:\s*handler'
      paths: ["~/.aiplat/skills/"]
      exclude: ["__pycache__"]
      grep_exclude: []
    message: "SKILL.md declares execution_type:handler — verify handler.py exists at same level (run: find ~/.aiplat/skills/ -name SKILL.md -exec dirname {} \\; | while read d; do grep -l 'execution_type.*handler' \"$d/SKILL.md\" 2>/dev/null && test -f \"$d/handler.py\" || echo \"MISSING: $d/handler.py\"; done)"

  # 46.2: Detect handler.py files without execution_type:handler declared
  - id: skill_execution_type_prompt_with_handler
    section: "§46"
    section_name: "执行真实性 — handler/execution_type 不一致"
    level: warning
    check:
      type: grep_forbidden
      pattern: 'execution_type:\s*prompt'
      paths: ["~/.aiplat/skills/"]
      exclude: ["__pycache__"]
      grep_exclude: []
    message: "SKILL.md declares execution_type:prompt — if handler.py exists in same dir, change to execution_type:handler"

  # ═══ Section 47: Structural Completeness — Known Dead Code ═══
  - id: zero_caller_todo_wire
    section: "§47"
    section_name: "接线完成度 — 零调用者标记"
    level: warning
    check:
      type: grep_forbidden
      pattern: '# TODO.*wire|# FIXME.*caller|# TODO.*caller|0 caller|zero caller|FIXME.*wire|待接线'
      paths: ["aiPlat-core/core"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["arch_guard_rules/"]
    message: "marked as needs-wiring or zero-caller — verify production caller exists or delete dead code"

  # ═══ Section 48: Agent Boundaries — No Direct Cross-Agent Calls ═══
  - id: agent_no_direct_execute_calls
    section: "§48"
    section_name: "Agent 边界 — 禁止直接调用其他 Agent"
    level: error
    check:
      type: grep_forbidden
      pattern: 'agent_registry\.get\(.+\)\.execute\(|_agents\[.+?\]\.execute\(|\.execute\(\s*AgentContext\('
      paths: ["aiPlat-core/core/apps/agents", "aiPlat-core/core/harness"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["multi_agent\\.py", "subagent/coordinator\\.py", "integration\\.py", "loop_engine\\.py", "coordination/patterns/", "harness_agent\\.py", "arch_guard_rules/"]
    message: "agent calling another agent directly — use AgentMessageBus or SubagentCoordinator"

  # ═══ Section 49: Observability — Trace/Span Enforcement ═══
  - id: syscall_missing_trace_id
    section: "§49"
    section_name: "可观测性 — trace_id/span_id 缺失检测"
    level: warning
    check:
      type: grep_forbidden
      pattern: '# FIXME.*trace|# TODO.*trace_id|# TODO.*span_id|### MISSING.*trace'
      paths: ["aiPlat-core/core/harness/syscalls"]
      exclude: ["__pycache__"]
      grep_exclude: ["arch_guard_rules/"]
    message: "syscall code marked as missing trace_id/span_id — add observability before merge"

  # ═══ Section 50: Agent Boundaries — No Direct Harness Internal Access ═══
  - id: agent_no_direct_harness_access
    section: "§50"
    section_name: "Agent 边界 — 禁止直访 Harness 内部状态"
    level: error
    check:
      type: grep_forbidden
      pattern: 'self\.harness\._|self\._harness\.|self\.harness\.budget_remaining|self\.harness\._internal'
      paths: ["aiPlat-core/core/apps/agents"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["base_agent\\.py", "agent_wrapper\\.py", "arch_guard_rules/"]
    message: "agent accessing harness internals — use read-only interface or facade"

  # ═══ Section 51: AGENT.md Size — Should Be Under 100 Lines ═══
  - id: agent_md_too_large
    section: "§51"
    section_name: "AGENT.md 大小 — 建议 <100 行"
    level: warning
    check:
      type: cmd_output
      shell: "find ~/.aiplat/agents/ -name 'AGENT.md' ! -path '*/auto/*' -exec wc -l {} + 2>/dev/null | awk '$1 > 200 && !/SOUL|MEMORY/ {print $2\": \"$1\" lines\"}' | head -5"
      ok_pattern: "^$"
    message: "AGENT.md exceeds 200 lines — consider splitting into docs/ai-workflows/ per §5.27.3"

  # ═══ Section 52: Core Module Dependency Direction ═══
  - id: core_module_backwards_dep_agents_to_harness
    section: "§52"
    section_name: "Core 模块依赖方向"
    level: error
    check:
      type: grep_forbidden
      pattern: 'from core\.harness\.execution\.engine import|from core\.harness\.execution\.loop import'
      paths: ["aiPlat-core/core/apps/agents"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["arch_guard_rules/"]
    message: "agents importing engine internals — violates core module dependency matrix (§5.14: agents→harness not authorized)"

  - id: core_module_backwards_dep_apps_to_harness_internal
    section: "§52"
    section_name: "Core 模块依赖方向"
    level: warning
    check:
      type: grep_forbidden
      pattern: 'from core\.harness\.execution\.engine import|from core\.harness\.memory\.working import'
      paths: ["aiPlat-core/core/apps"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["arch_guard_rules/"]
    message: "apps importing harness internal modules directly — use facade or service layer (§5.7)"

  # ═══ Section 53: Agent Design — No Query-Type Branching ═══
  - id: agent_no_query_type_branching
    section: "§53"
    section_name: "Agent 设计 — 禁止 if/elif 查询分类链"
    level: error
    check:
      type: grep_forbidden
      pattern: 'if query_type|elif query_type|if task_type|elif task_type|if intent_type|elif intent_type'
      paths: ["aiPlat-core/core/apps/agents"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["arch_guard_rules/", "intents\\.py", "prompt_assembler\\.py"]
    message: "agent contains query_type/task_type hardcoded branching — route through Internal Policy module per §5.9"

  # ═══ Section 54: UI — No Artifact Key Hardcoding ═══
  - id: ui_no_artifact_key_branching
    section: "§54"
    section_name: "UI — 禁止按 artifact key 做特殊分支"
    level: warning
    check:
      type: grep_forbidden
      pattern: "key === 'test_report'|key === 'architecture'|key === 'code'|key === 'prd'|key === 'test_plan'"
      paths: ["aiPlat-management/frontend/src", "aiPlat-app/src"]
      exclude: ["__pycache__", "node_modules/"]
      grep_exclude: ["arch_guard_rules/", "test_", "spec\\.ts"]
    message: "UI component branching on artifact key name — use structural properties (e.g. 'recommendation' in val) per MGMT §5.3"

  # ═══ Section 55: Agent Design — No Unauthorized BaseAgent Subclasses ═══
  - id: agent_no_new_subclass_outside_approved
    section: "§55"
    section_name: "Agent 设计 — 禁止新增未授权的 BaseAgent 子类"
    level: error
    check:
      type: grep_forbidden
      pattern: 'class \w+\(.*BaseAgent\)|class \w+\(.*ConfigurableAgent\)|class \w+\(.*IAgent\)'
      paths: ["aiPlat-core/core/apps/agents"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["base\\.py", "react\\.py", "rag\\.py", "materials_chat\\.py",
                     "plan_execute\\.py", "conversational\\.py", "multi_agent\\.py",
                     "arch_guard_rules/", "# noqa: agent-subclass-approved"]
    message: "new BaseAgent/IAgent subclass outside approved 7 implementation classes — use loop_type param or existing types per §5.22"

  # ═══ Section 56: Tool Name Uniqueness ═══
  - id: tool_name_uniqueness_duplicate_name
    section: "§56"
    section_name: "工具命名 — 重复 name 检测"
    level: warning
    check:
      type: grep_forbidden
      pattern: 'name:\s*"(tool_search|calculator|search|file_operations|webfetch|browser|http|database|repo)"'
      paths: ["aiPlat-core/core/apps/tools"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["arch_guard_rules/"]
    message: "potential tool name collision with built-in name — verify global uniqueness per §5.11"

  # ═══ Section 57: Workspace — No Engine Namespace Collision ═══
  - id: workspace_namespace_isolation
    section: "§57"
    section_name: "Workspace-Engine 命名空间隔离"
    level: warning
    check:
      type: cmd_output
      shell: "python3 -c \"
import os
base = os.path.expanduser('~/.aiplat/skills')
engine = os.path.join(os.path.dirname(os.path.dirname(__file__)), 'core/engine/skills')
workspace_ids = set()
engine_ids = set()
for p in [base, engine]:
    if not os.path.isdir(p): continue
    for d in os.listdir(p):
        if os.path.isdir(os.path.join(p, d)):
            (workspace_ids if p == base else engine_ids).add(d)
collisions = workspace_ids & engine_ids
if collisions:
    for c in sorted(collisions):
        print(f'WARN: workspace skill {c!r} collides with engine skill')
\" 2>/dev/null"
      ok_pattern: "^$"
    message: "workspace skill ID collides with engine skill — use distinct namespace per §5.13"

  # ═══ Section 58: Harness — No New Execution Subclasses ═══
  - id: harness_no_new_subclass
    section: "§58"
    section_name: "Harness — 禁止新增执行子类"
    level: error
    check:
      type: grep_forbidden
      pattern: 'class \w+\((ReActLoop|PipelineEngine|StageRunner)\)'
      paths: ["aiPlat-core/core/"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["harness/execution/loop\\.py", "harness/execution/pipeline_engine\\.py",
                     "harness/execution/stage_runner\\.py", "arch_guard_rules/",
                     "# noqa: harness-subclass-approved"]
    message: "new ReActLoop/PipelineEngine/StageRunner subclass outside approved files — use Agent type config not engine subclass per §5.22"

  # ═══ Section 59: AGENT.md Handoff Completeness ═══
  - id: agent_md_missing_handoff_fields
    section: "§59"
    section_name: "AGENT.md 交接字段完整性"
    level: warning
    check:
      type: grep_forbidden
      pattern: '^handoff:|^交接信息:|^handoff_target:'
      paths: ["~/.aiplat/agents/"]
      exclude: ["__pycache__"]
      grep_exclude: ["SOUL\\.md", "MEMORY\\.md", "auto/", "arch_guard_rules/"]
    message: "AGENT.md may be missing handoff fields — 建议添加 5 项交接信息 per §5.27.2"

  # ═══ Section 60: Evaluation — No State Mutation ═══
  - id: eval_pure_no_state_mutation
    section: "§60"
    section_name: "评估函数 — 禁止直接写 state"
    level: error
    check:
      type: grep_forbidden
      pattern: 'state\[|state\.(update|set|pop|__setitem__|clear)'
      paths: ["aiPlat-core/core/harness/evaluation"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: ["_exec_test_runner", "arch_guard_rules/", "# noqa: eval-state-mutation"]
    message: "evaluation function mutating state — evaluation functions must be pure, state changes belong in _exec_test_runner per §5.23.4"

  # ═══ Section 61: Installed Skill Structure Compliance ═══
  - id: skill_empty_scripts_dir
    section: "§61"
    section_name: "Skill 安装结构合规"
    level: warning
    check:
      type: cmd_output
      cmd: "find ~/.aiplat/skills/ -maxdepth 2 -name scripts -type d -empty 2>/dev/null"
      ok_pattern: "^$"
    message: "Empty scripts/ directory in installed skill — likely Path B zip import nesting artifact. Re-import via installer."

  - id: skill_nested_skill_md
    section: "§61"
    section_name: "Skill 安装结构合规"
    level: error
    check:
      type: cmd_output
      cmd: "find ~/.aiplat/skills/*/skills/ -name 'SKILL.md' 2>/dev/null"
      ok_pattern: "^$"
    message: "Nested skills/*/SKILL.md — broken zip import structure. Run adapt_skill() or re-import."

  - id: skill_nested_revisions
    section: "§61"
    section_name: "Skill 安装结构合规"
    level: warning
    check:
      type: cmd_output
      cmd: "find ~/.aiplat/skills/ -path '*/.revisions/*/SKILL.md' 2>/dev/null"
      ok_pattern: "SKILL.md"
    message: ".revisions/ backup SKILL.md present — expected after updates, safe to ignore unless excessive."

  - id: skill_handler_for_scripts
    section: "§61"
    section_name: "Skill 安装结构合规"
    level: warning
    check:
      type: cmd_output
      cmd: "for d in ~/.aiplat/skills/*/; do [ -f \"$d/scripts/\"*.py ] 2>/dev/null && [ ! -f \"$d/handler.py\" ] && echo \"$d\"; done"
      ok_pattern: "^$"
    message: "Skill has scripts/*.py but no handler.py — should have execution_type: handler + handler.py"

  # ═══ Section 62: Installed Agent/Workflow/MCP Structure Compliance ═══
  - id: agent_nested_path
    section: "§62"
    section_name: "Agent 安装结构合规"
    level: error
    check:
      type: cmd_output
      cmd: "find ~/.aiplat/agents/ -mindepth 3 -name 'AGENT.md' -not -path '*/.revisions/*' 2>/dev/null"
      ok_pattern: "^$"
    message: "Nested AGENT.md at depth >=3 — broken zip import. Flatten directories or re-import."

  - id: workflow_nested_path
    section: "§63"
    section_name: "Workflow 安装结构合规"
    level: error
    check:
      type: cmd_output
      cmd: "find ~/.aiplat/workflows/ -mindepth 3 -name 'workflow.yaml' 2>/dev/null"
      ok_pattern: "^$"
    message: "Nested workflow.yaml at depth >=3 — broken zip import structure."

  - id: mcp_nested_path
    section: "§64"
    section_name: "MCP 安装结构合规"
    level: error
    check:
      type: cmd_output
      cmd: "find ~/.aiplat/mcps/ -mindepth 3 -name 'server.yaml' 2>/dev/null"
      ok_pattern: "^$"
    message: "Nested server.yaml at depth >=3 — broken zip import structure."

  - id: skill_nested_revisions
    section: "§61"
    section_name: "Skill 安装结构合规"
    level: warning
    check:
      type: cmd_output
      cmd: "find ~/.aiplat/skills/ -path '*/skills/*/SKILL.md' -not -path '*/.revisions/*' 2>/dev/null"
      ok_pattern: "^$"
    message: "Nested skills/*/SKILL.md (not in .revisions/) — broken zip import. Run adapt_skill() or re-import."

  - id: agent_split_1_bug
    section: "§62"
    section_name: "Agent 导入链路合规"
    level: error
    check:
      type: grep_forbidden
      pattern: 'split\("/",\s*1\)'
      paths: ["aiPlat-core/core/api/routers/workspace_agents.py"]
      exclude: ["__pycache__", "tests/", "arch_guard_rules/"]
      grep_exclude: ["# noqa: split-1-approved", "shlex.split"]
    message: "agent CREATE endpoint uses split('/',1) — will produce nested paths for GitHub release zips. Use _find_asset_dirs + copytree instead."

  - id: mgmt_proxy_coverage_overview
    section: "§63"
    section_name: "管理端代理路由覆盖"
    level: warning
    check:
      type: grep_required
      pattern: "@router\\.get\\(\"/overview\"\\)"
      paths: ["aiPlat-management/management/api/core.py"]
      exclude: ["__pycache__", "tests/"]
      grep_exclude: []
    message: "管理端缺少 /overview 代理路由。在 core/api/routers/overview.py 新增 @router 后，必须在 management/api/core.py 同步添加代理路由。"

