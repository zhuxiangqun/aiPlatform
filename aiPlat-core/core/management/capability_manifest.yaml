        key_methods: ["create_react_agent"]
      - module: "aiPlat-core/core/apps/agents/conversational.py"
        key_methods: ["create_conversational_agent"]
      - module: "aiPlat-core/core/apps/agents/rag.py"
        key_methods: ["create_rag_agent"]
      - module: "aiPlat-core/core/apps/agents/materials_chat.py"
        key_methods: ["create_materials_chat_agent"]
      - module: "aiPlat-core/core/apps/agents/multi_agent.py"
        key_methods: ["create_multi_agent"]

  - id: agent_discovery
    domain: "Agent"
    declared_in: "ARCHITECTURE_REPORT §3.1"
    name: "AGENT.md发现与编译"
    description: "目录扫描→解析YAML frontmatter→验证5字段交接协议→注册AgentRegistry"
    entry_points: ["aiPlat-core/core/apps/agents/discovery.py"]
    provided_by:
      - module: "aiPlat-core/core/apps/agents/discovery.py"
        key_methods: ["discover"]

  - id: agent_message_bus
    domain: "Agent"
    declared_in: "ARCHITECTURE_REPORT §3.1"
    name: "Agent间消息通信(MessageBus)"
    description: "TASK_ASSIGN/PROGRESS_UPDATE/RESULT/ERROR/CANCEL 5种消息类型"
    entry_points: ["aiPlat-core/core/apps/agents/multi_agent.py"]
    provided_by:
      - module: "aiPlat-core/core/apps/agents/multi_agent.py"
        key_methods: ["coordinate"]

  # ═══════════════════════════════════════════════════════════════
  # Skill 系统
  # ═══════════════════════════════════════════════════════════════

  - id: skill_definition
    domain: "Skill"
