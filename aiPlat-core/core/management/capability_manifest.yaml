# aiPlat 系统能力声明清单
# 
# 来源: AIPLAT_ARCHITECTURE_REPORT.md (31章) + AIPLAT_ROADMAP.md (Phase 0-6)
# 
# 每条能力声明由三个维度交叉验证:
#   1. 模块可达性 — entry_point 出发 BFS 遍历 import 边，检查 provided_by 模块是否可达
#   2. 方法级调用 — 每个 key_methods 是否有外部 production caller
#   3. 依赖完整性 — 每个 depends_on 是否确实被引用
#
# 维护规则: 修改 CLAUDE.md §5.x 或 ROADMAP.md Phase 时，必须同步更新此文件

capabilities:

  # ═══════════════════════════════════════════════════════════════
  # Harness 执行内核
  # ═══════════════════════════════════════════════════════════════

  - id: pipeline_engine
    domain: "执行内核"
    declared_in: "ARCHITECTURE_REPORT §2.1"
    name: "PipelineEngine — YAML驱动流水线编排"
    description: "编译PipelineStageConfig为LangGraph流水线，委托StageRunner/ReActLoop执行，管理checkpoint/快照/恢复"
    entry_points: ["aiPlat-core/core/harness/execution/pipeline_engine.py"]
    provided_by:
      - module: "aiPlat-core/core/harness/execution/pipeline_engine.py"
        key_methods: ["start", "resume", "_compile_pipeline"]
    depends_on:
      - module: "aiPlat-core/core/harness/execution/langgraph/"
        via: "LangGraph StateGraph构建"
      - module: "aiPlat-core/core/harness/execution/loop.py"
        via: "StageRunner→ReActLoop"

  - id: langgraph_orchestration
    domain: "执行内核"
    declared_in: "ARCHITECTURE_REPORT §2.1"
    name: "LangGraph PipelineGraph — 编排层(只编排不执行)"
    description: "构建node→edge拓扑，产生graph_trace事件。显式与执行逻辑分离。"
    entry_points: ["aiPlat-core/core/harness/execution/pipeline_engine.py"]
    provided_by:
      - module: "aiPlat-core/core/harness/execution/langgraph/core.py"
        key_methods: ["CompiledGraph"]
    depends_on:
      - module: "aiPlat-core/core/harness/execution/langgraph/graphs/pipeline.py"
        via: "PipelineGraph"

  - id: react_loop_executor
    domain: "执行内核"
    declared_in: "ARCHITECTURE_REPORT §2.1"
    name: "ReActLoop — Reason→Act→Observe执行循环"
    description: "每阶段执行循环，14 Hook拦截点，Token预算100K/60K，5级压缩"
    entry_points: ["aiPlat-core/core/harness/execution/loop.py"]
    provided_by:
      - module: "aiPlat-core/core/harness/execution/loop.py"
        key_methods: ["run", "_reason", "_act", "_observe"]
    depends_on:
      - module: "aiPlat-core/core/harness/syscalls/llm.py"
        via: "sys_llm_generate"
      - module: "aiPlat-core/core/harness/infrastructure/hooks/"
        via: "14生命周期Hook"

  - id: syscall_boundary
    domain: "执行内核"
    declared_in: "ARCHITECTURE_REPORT §2.1"
    name: "Syscall强制边界(LLM/Tool/Skill)"
    description: "所有LLM调用/工具执行/技能调用必须经过syscall边界，不可绕过"
    entry_points: ["aiPlat-core/core/harness/execution/loop.py"]
    provided_by:
      - module: "aiPlat-core/core/harness/syscalls/llm.py"
        key_methods: ["sys_llm_generate"]
      - module: "aiPlat-core/core/harness/syscalls/tool.py"
        key_methods: ["sys_tool_call"]
      - module: "aiPlat-core/core/harness/syscalls/skill.py"
        key_methods: ["sys_skill_call"]
    depends_on:
      - module: "aiPlat-core/core/harness/infrastructure/policy_gate.py"
        via: "PolicyGate拦截"

  - id: hook_interception
    domain: "执行内核"
    declared_in: "ARCHITECTURE_REPORT §2.1"
    name: "14-Point Hook拦截系统"
    description: "PreLoop→...→PostObserve→Stop等14个拦截点，零Token成本，支持自定义Hook"
    entry_points: ["aiPlat-core/core/harness/execution/loop.py"]
    provided_by:
      - module: "aiPlat-core/core/harness/infrastructure/hooks/hook_manager.py"
        key_methods: ["register", "trigger"]
      - module: "aiPlat-core/core/harness/infrastructure/hooks/on_error_reflector.py"
        key_methods: ["on_post_observe"]

  - id: token_compression
    domain: "执行内核"
    declared_in: "ARCHITECTURE_REPORT §2.1, §8.1"
    name: "5级Token压缩+优先级标签"
    description: "NORMAL(70%)→REPLACE(80%)→PRUNE(85%)→AGGRESSIVE(90%)→EMERGENCY(99%)。CLAUDE.md永不压缩。"
    entry_points: ["aiPlat-core/core/harness/execution/loop.py"]
    provided_by:
      - module: "aiPlat-core/core/harness/memory/manager.py"
        key_methods: ["build_context", "compact"]

  - id: pipeline_parallel
    domain: "执行内核"
    declared_in: "ARCHITECTURE_REPORT §2.1, ROADMAP Phase 1.2"
    name: "Sub-Agent FanOut Map-Reduce并行执行"
    description: "asyncio.gather+Semaphore层内并行 + ParallelExecutor Map-Reduce语义"
    entry_points: ["aiPlat-core/core/harness/execution/pipeline_engine.py"]
    provided_by:
      - module: "aiPlat-core/core/apps/agents/parallel_executor.py"
        key_methods: ["map", "map_reduce", "parallel_analyze"]
      - module: "aiPlat-core/core/apps/agents/parallel_executor.py"
        key_methods: ["EmbeddingBridge"]

  # ═══════════════════════════════════════════════════════════════
  # Agent 系统
  # ═══════════════════════════════════════════════════════════════

  - id: agent_type_system
