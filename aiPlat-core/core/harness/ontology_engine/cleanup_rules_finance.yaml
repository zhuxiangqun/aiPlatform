# 金融行业文档清洗规则集
industry: finance

rules:
  # ── 股票/证券代码 ──
  - name: "finance_stock_code"
    pattern: r"^\s*(SH|SZ|BJ|HK)?\d{6}(\.(SH|SZ|BJ|HK))?\s*$"
    action: remove
    description: "独立股票代码行（无法与公司名称关联的隔离代码）"

  - name: "finance_index_value"
    pattern: r"^\s*[+-]?\d+\.\d{2,4}%\s*$"
    action: remove
    description: "独立涨跌幅数字（没有说明的百分比）"

  # ── 银行/理财 ──
  - name: "finance_product_series"
    pattern: r"(结构性存款|大额存单|理财产品|基金定投)\s*(第\s*\d+\s*期|系列[A-Z])?"
    action: mask
    description: "理财产品系列名称 → [MASKED]"

  - name: "finance_disclaimer"
    pattern: r"(理财有风险|投资须谨慎|过往业绩不预示未来|产品有风险.*须谨慎)"
    action: mask
    description: "风险提示固定文案 → [MASKED]"

  # ── 监管/合规 ──
  - name: "finance_regulation_ref"
    pattern: r"^(根据|依据|按照)\s*(银保监会|证监会|人民银行|央行|银发|银监发|证监发)\s*[^。]*$"
    action: remove
    description: "监管引用行（无实质业务数据）"

  # ── 金额格式化 ──
  - name: "finance_amount_standalone"
    pattern: r"^\s*[¥￥]?\s*\d{1,3}(,\d{3})*(\.\d{2})?\s*$"
    action: remove
    description: "独立金额行（无法对应具体项目的金额数字）"
