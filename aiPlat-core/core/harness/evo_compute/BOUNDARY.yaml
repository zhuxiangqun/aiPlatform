layer: core
rationale: |
  Harness 子模块目录（evo_compute）。受控演化计算底座（Genome Registry /
  Fitness / Sandbox / Candidate 状态机 / 闭环 KPI 基线 / 三试点 /
  预算硬上限 / 安全边界 / 夹具回放 / G0–G2 出口就绪 / DE-ES / GA /
  覆盖探针 / 冻结回归门 / AIS 异常检测-only / GP 强类型 DSL /
  HUMAN_GATE 覆盖审计 / 闭环 L4 评估报告 / 生产加深 D1 活源与台账 /
  G3 出口就绪）。符合
  boundary-standard.md §3.1——Harness 是 AI Runtime Kernel，本目录为执行
  基础设施的一部分。不写生产配置、不采生产流量、不自动批准预算/安全、
  不宣称 E2 / G0–G3 默认出口完成；AIS 先检测不修复；GP 不生成核心代码；
  Canary 探针只读无切流；夹具 ≠ 生产 L4。
