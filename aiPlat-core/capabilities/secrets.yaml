# Capability Contract: Secrets Manager (密钥管理)
domain: ai-security
capability: secrets
description: "密钥管理——API Key、Token 等敏感数据的加密存储与安全验证"
owner: core-security
version: "1.0.0"
updated: "2026-07-13"

authoritative:
  path: aiPlat-core/core/harness/infrastructure/secrets_manager.py
  entry_point: get_secrets_manager
  class: SecretsManager
  factory: get_secrets_manager
  public_symbols:
    - SecretsManager
    - get_secrets_manager

forbidden_direct_imports:
  - "os.getenv used directly instead of SecretsManager for API keys"

methods:
  - name: get_secret
    signature: "(key_id) -> Optional[str]"
    purpose: "安全获取解密后的密钥"
  - name: store_secret
    signature: "(key_id, value) -> None"
    purpose: "加密存储密钥"
  - name: get_secrets_manager
    signature: "() -> SecretsManager"
    purpose: "获取全局密钥管理器单例"

consumer_patterns:
  - "harness/syscalls/"
  - "harness/infrastructure/"
  - "api/"
  - "harness/execution/"
  - "apps/"
  - "management/"
  - "server"
