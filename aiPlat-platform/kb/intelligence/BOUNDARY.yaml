layer: platform
rationale: |
  符合 boundary-standard.md §3.2（检索编排路由归 Platform）。
  本目录的 query.py 负责路由编排（选择检索模式、调用 Core retriever），
  不实现检索算法（余弦相似度、关键词评分已在 Core）。
  
  LLM 调用部分（summarize/llm）是应用层编排，不包含模型加载和推理。
