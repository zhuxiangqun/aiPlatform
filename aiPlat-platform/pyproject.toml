[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiplat-platform"
version = "0.1.0"
description = "AI Platform Layer - REST API, Auth, Tenants, API Gateway"
requires-python = ">=3.10"
dependencies = [
    "aiplat-core",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]

[tool.setuptools]
# Flat multi-package layout — enumerate top-level packages explicitly
# (setuptools flat-layout auto-discovery errors on multiple top-level dirs).
packages = [
    "api",
    "auth",
    "apps",
    "billing",
    "tenants",
    "gateway",
    "builder",
    "storage",
    "registry",
    "services",
    "messaging",
    "deployment",
    "governance",
    "kb",
    "utils",
]
